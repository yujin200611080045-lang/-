<!doctype html><html lang="zh-CN"><head><script>location.replace('./lab.html?v=053');</script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="be"><meta name="theme-color" content="#000000"><title>be V0.5.0</title><style>*{box-sizing:border-box}html,body{margin:0;background:#000;height:100%;overflow:hidden}main{width:100%;height:100dvh;display:grid;place-items:center}svg{width:100%;height:100%;display:block;max-width:calc(100dvh * .58)}@media(min-width:600px){svg{max-width:calc(100dvh * 390 / 844)}}html,body{overscroll-behavior:none;touch-action:none}main{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none}</style><style>#shell{position:fixed;inset:0;background:#000;color:#fff;display:none;overflow:auto;touch-action:pan-y;padding: max(48px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));font:15px system-ui}#shell *{touch-action:auto}#shell h1{font-size:24px;font-weight:500;margin:12px 0 26px}#shell button,#shell input,#shell textarea,#shell select{font:inherit;color:white;background:#000;border:1px solid #444;border-radius:9px;padding:12px}#shell input,#shell textarea,#shell select{width:100%;margin:6px 0 15px}#shell textarea{min-height:150px;resize:vertical}#shell button{cursor:pointer}#shell label{display:block;color:#aaa;font-size:13px}#shell .apps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}#shell .app{border:0;display:grid;justify-items:center;gap:9px;padding:0}#shell .tile{width:62px;height:62px;border:1px solid #555;border-radius:16px;display:grid;place-items:center;font-size:27px}#shell .bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:20px}#shell .msg{white-space:pre-wrap;overflow-wrap:anywhere;padding:12px;border:1px solid #333;borde //www.w3.org/2000/svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-label="be 原创手绘字形锁屏"><rect width="390" height="844" fill="#000"/><g id="mark" fill="#fff" transform="translate(0 35) translate(195 422) scale(1.08) translate(-195 -422) translate(0 -40)"><g transform="translate(-5 101)"><path d="M239 -4 C175 57 89 132 25 198 C-23 246 -63 290 -47 307 C-29 329 72 316 155 294 C261 265 370 218 400 174 C417 150 402 130 378 119 C304 84 112 139 -66 258 C112 143 303 88 377 122 C399 132 413 150 396 172 C363 211 255 257 151 285 C72 307 -22 326 -39 305 C-54 285 -14 244 32 198 C94 131 176 58 239 -4 Z"/></g><g transform="translate(-5 436)"><path d="M399 37 C309 -3 168 56 69 143 C15 190 -12 235 2 267 C21 312 120 325 246 309 C322 300 382 280 410 260 C420 251 395 243 367 246 C350 247 339 250 327 254 C355 249 383 253 400 259 C371 277 317 292 245 300 C120 316 28 309 15 268 C3 235 30 191 76 145 C172 55 309 1 399 39 Z"/><path d="M404 99 C344 145 254 171 191 178 C145 183 125 176 136 151 C119 177 145 186 191 181 C266 174 349 146 404 101 Z"/></g></g><g id="threads" fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round"></g><text id="word" x="195" y="422" text-anchor="middle" dominant-baseline="central" font-family="Arial,sans-serif" font-size="76" font-weight="700" fill="white" opacity="0">be</text></svg></main><script>document.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});document.addEventListener("wheel",e=>e.preventDefault(),{passive:false});</script><script>
const mark=document.getElementById('mark'),svg=mark.ownerSVGElement,threads=document.getElementById('threads'),word=document.getElementById('word'),ns=svg.namespaceURI;
const ds=['M239 -4 C175 57 89 132 25 198 C-23 246 -63 290 -43 306 C-29 329 72 316 155 290 C261 265 370 218 398 173 C417 150 402 130 378 120 C304 84 112 139 -66 258','M399 38 C309 -3 168 56 72 144 C15 190 -12 235 8 267 C21 312 120 325 246 305 C322 300 382 280 405 260 C395 243 350 247 327 254','M404 100 C344 145 254 171 191 179 C145 183 125 176 136 151'];
const N=180, cx=195,cy=422;
const lines=ds.map((d,i)=>{const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('visibility','hidden');mark.children[i?1:0].append(p);const m=svg.getScreenCTM().inverse().multiply(p.getScreenCTM());const pts=Array.from({length:N+1},(_,j)=>{const a=p.getPointAtLength(p.getTotalLength()*j/N);return new DOMPoint(a.x,a.y).matrixTransform(m)});if(i===2)pts.reverse();const out=document.createElementNS(ns,'path');threads.append(out);const target=document.createElementNS(ns,'path');target.setAttribute('d',['M159 396 L159 448 L159 428 C159 410 188 409 188 429 C188 450 159 451 159 428','M230 429 L205 429 C205 410 232 410 232 429 L205 429 C205 449 222 451 232 440','M232 424 L205 424'][i]);const dest=pts.map((_,j)=>target.getPointAtLength(target.getTotalLength()*j/N));return {pts,out,dest};});
const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function render(t){mark.style.opacity=1-smooth(t/.12);const swap=smooth((t-.85)/.15);threads.style.opacity=smooth(t/.12)*(1-swap);word.setAttribute('opacity',0);const scale=.055+.945*swap;word.setAttribute('transform','translate(195 422) scale('+scale+') translate(-195 -422)');lines.forEach(({pts,out,dest},i)=>{const head=pts[N],a0=Math.atan2(head.y-cy,head.x-cx),r0=Math.hypot(head.x-cx,head.y-cy);function trail(u){if(u<=0){const k=Math.max(0,Math.min(N,N+u*N));const j=Math.floor(k),f=k-j;const a=pts[j],b=pts[Math.min(N,j+1)];return [a.x+(b.x-a.x)*f,a.y+(b.y-a.y)*f]}if(i===2){const prev=pts[N-3],dx=head.x-prev.x,dy=head.y-prev.y,len=Math.hypot(dx,dy)||1;return [head.x+dx/len*u*550,head.y+dy/len*u*900]}if(i===0){const z=Math.min(1,u),prev=pts[N-3],dx=head.x-prev.x,dy=head.y-prev.y,len=Math.hypot(dx,dy)||1;const route=document.getElementById('bRoute');const p=route.getPointAtLength(route.getTotalLength()*z);return [p.x,p.y]}const z=Math.min(1,u),a=a0+Math.PI*2.2*z,r=r0*Math.pow(1-z,2.2)+2.5*z;const spiral=[cx+r*Math.cos(a),cy+r*Math.sin(a)];const prev=pts[N-3],len=Math.hypot(head.x-prev.x,head.y-prev.y)||1;const tangent=[head.x+(head.x-prev.x)/len*z*500,head.y+(head.y-prev.y)/len*z*500];const blend=smooth(z/.15);return [tangent[0]*(1-blend)+spiral[0]*blend,tangent[1]*(1-blend)+spiral[1]*blend]}const progress=smooth(t/.85)*1.04,lag=.95*(1-smooth((t-.25)/.60))+.012;const morph=0;if(i===2){out.setAttribute('opacity',1-smooth((t-.65)/.18));}const pp=Array.from({length:N+1},(_,j)=>{const p=trail(progress-lag*(1-j/N)),b=dest[j];return [p[0]*(1-morph)+b.x*morph,p[1]*(1-morph)+b.y*morph]});let d='M'+pp[0].join(' ');for(let j=1;j<N;j++){const a=pp[j],b=pp[j+1];d+=' Q'+a.join(' ')+' '+[(a[0]+b[0])/2,(a[1]+b[1])/2].join(' ')}d+=' L'+pp[N].join(' ');const left=[],right=[];for(let j=0;j<=N;j++){const a=pp[Math.max(0,j-1)],b=pp[Math.min(N,j+1)],dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1;const f=j/N;const taper=Math.pow(Math.sin(Math.PI*f),.65);const profile=i===0?(.45+5*Math.exp(-Math.pow((f-.56)/.23,2))):i===1?(.55+5.5*Math.exp(-Math.pow((f-.62)/.23,2))):(.35+1.2*Math.sin(Math.PI*f));const w=profile*taper*(1-.75*smooth((t-.65)/.2));left.push([pp[j][0]-dy/len*w,pp[j][1]+dx/len*w]);right.push([pp[j][0]+dy/len*w,pp[j][1]-dx/len*w]);}const poly=left.concat(right.reverse());out.setAttribute('d','M'+poly.map(p=>p.join(' ')).join(' L')+' Z');out.setAttribute('fill','white');out.setAttribute('stroke','none');});}
const bh=lines[0].pts[N],bp=lines[0].pts[N-3],bl=Math.hypot(bh.x-bp.x,bh.y-bp.y)||1;const br=document.createElementNS(ns,'path');br.id='bRoute';br.setAttribute('visibility','hidden');br.setAttribute('d','M'+bh.x+' '+bh.y+' C'+(bh.x+(bh.x-bp.x)/bl*100)+' '+(bh.y+(bh.y-bp.y)/bl*100)+' -100 560 90 650 C290 740 430 520 300 390 C220 310 110 380 155 450 C185 490 245 455 215 420 C205 407 192 414 195 422');svg.append(br);let busy=false,done=false;render(0);document.querySelector('main').addEventListener('click',()=>{if(busy)return;busy=true;const start=performance.now();function frame(now){const p=Math.min(1,(now-start)/3000);render(done?1-p:p);if(p<1)requestAnimationFrame(frame);else{done=!done;busy=false;if(done)openApp('home')}}requestAnimationFrame(frame)});
</script><section id="shell"></section><script>
const $=id=>document.getElementById(id),shell=$('shell');const storage='be-lab-v050';
let db;try{db=JSON.parse(localStorage.getItem(storage))}catch{}if(!db||!db.presets||!db.cards)db={presets:[{id:'p1',name:'默认预设',url:'',model:'',temperature:.7}],cards:[{id:'c1',name:'新角色',prompt:''}],pid:'p1',cid:'c1',history:[]};const keys={};let pending=false,view='home',controller=null;
const save=()=>localStorage.setItem(storage,JSON.stringify(db));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const preset=()=>db.presets.find(p=>p.id===db.pid)||db.presets[0];const card=()=>db.cards.find(p=>p.id===db.cid)||db.cards[0];const options=(arr,id)=>arr.map(p=>'<option value="'+esc(p.id)+'" '+(p.id===id?'selected':'')+'>'+esc(p.name)+'</option>').join('');
function openApp(v){view=v;shell.style.display='block';document.querySelector('main').style.display='none';renderApp()}
function header(name){return '<div class="bar"><button onclick="openApp(\'home\')">‹ 桌面</button><span>'+name+'</span><span></span></div>'}
function renderApp(){if(view==='home'){shell.innerHTML='<h1>be <small style="font-size:11px;color:#777">V0.5.1</small></h1><div class="apps"><button class="app" onclick="openApp(\'chat\')"><span class="tile">☏</span>聊天</button><button class="app" onclick="openApp(\'settings\')"><span class="tile">⚙</span>设置</button><button class="app" onclick="openApp(\'cards\')"><span class="tile">♙</span>角色卡</button></div>';return}
if(view==='settings'){const p=preset();shell.innerHTML=header('设置')+'<label>API 预设</label><select id="ps" onchange="db.pid=this.value;save();renderApp()">'+options(db.presets,p.id)+'</select><label>预设名称</label><input id="pn" value="'+esc(p.name)+'"><label>API Base URL（OpenAI 兼容）</label><input id="pu" placeholder="https://api.example.com/v1" value="'+esc(p.url)+'"><label>API Key（仅当前页面内存，不持久保存）</label><input id="pk" type="password" autocomplete="off" value="'+esc(keys[p.id]||'')+'"><label>模型名称</label><input id="pm" value="'+esc(p.model)+'"><label>Temperature <span id="tv">'+p.temperature+'</span></label><input id="pt" type="range" min="0" max="2" step=".05" value="'+p.temperature+'" oninput="$(\'tv\').textContent=this.value"><div class="actions"><button onclick="savePreset()">保存预设</button><button onclick="newPreset()">新建预设</button><button onclick="deletePreset()">删除</button></div><p class="meta">请求直接发送至填写的 API 服务；需支持浏览器跨域访问。</p><p id="status"></p>';return}
if(view==='cards'){const c=card();shell.innerHTML=header('角色卡')+'<label>当前角色</label><select onchange="db.cid=this.value;save();renderApp()">'+options(db.cards,c.id)+'</select><label>角色名称</label><input id="cn" value="'+esc(c.name)+'"><label>角色设定 / System Prompt</label><textarea id="cp">'+esc(c.prompt)+'</textarea><div class="actions"><button onclick="saveCard()">保存角色卡</button><button onclick="newCard()">新建角色</button><button onclick="deleteCard()">删除</button></div><p id="status"></p>';return}
const p=preset(),c=card();shell.innerHTML='<div class="chatpage"><header class="chathead"><button onclick="openApp(\'home\')">‹</button><div><strong>'+esc(c.name)+'</strong><small>'+esc(p.model||'未配置模型')+'</small></div><button onclick="document.getElementById(\'chatmenu\').hidden=!document.getElementById(\'chatmenu\').hidden">···</button></header><div id="chatmenu" hidden><button onclick="clearChat()">新实验</button><button onclick="exportChat()">导出记录</button></div><div id="messages">'+db.history.filter(m=>m.cid===c.id).map(m=>'<div class="chatrow '+(m.role==='user'?'self':'other')+'"><span class="avatar">'+(m.role==='user'?'我':esc(c.name.slice(0,1)))+'</span><div class="bubble">'+esc(m.content)+'</div></div>').join('')+'</div><p id="status" class="error"></p><footer class="composer"><textarea id="message" rows="1" placeholder="输入消息…"></textarea><button id="send" onclick="sendMessage()" '+(pending?'disabled':'')+'>↑</button></footer></div>';requestAnimationFrame(()=>{const m=$('messages');if(m)m.scrollTop=m.scrollHeight})}
function savePreset(){const p=preset();Object.assign(p,{name:$('pn').value.trim()||'未命名',url:$('pu').value.trim(),model:$('pm').value.trim(),temperature:Number($('pt').value)});keys[p.id]=$('pk').value;save();renderApp();$('status').textContent='已保存'}
function newPreset(){savePreset();const p={id:uid(),name:'新预设',url:'',model:'',temperature:.7};db.presets.push(p);db.pid=p.id;save();renderApp()}
function deletePreset(){if(db.presets.length<2||!confirm('删除当前预设？'))return;delete keys[db.pid];db.presets=db.presets.filter(p=>p.id!==db.pid);db.pid=db.presets[0].id;save();renderApp()}
function saveCard(){Object.assign(card(),{name:$('cn').value.trim()||'未命名',prompt:$('cp').value});save();renderApp();$('status').textContent='已保存'}
function newCard(){saveCard();const c={id:uid(),name:'新角色',prompt:''};db.cards.push(c);db.cid=c.id;save();renderApp()}
function deleteCard(){if(db.cards.length<2||!confirm('删除当前角色卡？'))return;db.cards=db.cards.filter(c=>c.id!==db.cid);db.cid=db.cards[0].id;save();renderApp()}
function clearChat(){if(pending||!confirm('清空当前角色的聊天记录？'))return;db.history=db.history.filter(m=>m.cid!==card().id);save();renderApp()}
function exportChat(){const p=preset(),c=card();const data={exportedAt:new Date().toISOString(),preset:p,card:c,messages:db.history.filter(m=>m.cid===c.id)};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='be-experiment.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function sendMessage(){if(pending)return;const p={...preset()},c={...card()},msg=$('message').value.trim();if(!msg)return;let url;try{url=new URL(p.url);if(url.protocol!=='https:')throw Error();}catch{$('status').textContent='请先配置有效的 HTTPS API 地址';return}if(!p.model){$('status').textContent='请先填写模型名称';return}const endpoint=url.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'')+'/chat/completions';const prior=db.history.filter(m=>m.cid===c.id).map(({role,content})=>({role,content}));pending=true;$('send').disabled=true;$('status').textContent='生成中…';try{const headers={'Content-Type':'application/json'};if(keys[p.id])headers.Authorization='Bearer '+keys[p.id];controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),90000);let res;try{res=await fetch(endpoint,{method:'POST',headers,signal:controller.signal,body:JSON.stringify({model:p.model,temperature:p.temperature,messages:[...(c.prompt?[{role:'system',content:c.prompt}]:[]),...prior,{role:'user',content:msg}]})})}finally{clearTimeout(timeout)}if(!res.ok)throw Error('HTTP '+res.status+' '+(await res.text()).slice(0,300));const data=await res.json(),reply=data.choices?.[0]?.message?.content;if(typeof reply!=='string')throw Error('API 未返回文本回复');db.history.push({cid:c.id,role:'user',content:msg},{cid:c.id,role:'assistant',content:reply,presetId:p.id,model:p.model,temperature:p.temperature,time:new Date().toISOString()});save();pending=false;if(view==='chat')renderApp()}catch(e){pending=false;if(view==='chat'){$('status').textContent='请求失败：'+e.message+'。请检查 API、Key 或跨域限制。';$('send').disabled=false}}}
document.addEventListener('touchmove',e=>{if(shell.style.display==='block')e.stopImmediatePropagation()},{capture:true,passive:true});
</script></body></html>
