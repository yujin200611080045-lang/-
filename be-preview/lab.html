function networkLabel(n){if(!Array.isArray(n?.graph?.nodes)||!Array.isArray(n?.graph?.edges))return '无有效网络';const g=n.graph,l=n.layers;let label=g.nodes.length+'节点 / '+g.edges.length+'关联';if(l&&Array.isArray(l.enabled)&&Array.isArray(l.free?.paths)){const [a,b,f]=l.enabled;label=g.nodes.length+'节点 / '+(a?g.edges.filter(e=>e.evidence==='explicit').length:0)+'明确 / '+(b?g.edges.filter(e=>e.evidence==='inferred').length:0)+'推测 / '+(f?l.free.paths.length:0)+'自由路径'}return label+' · '+(n.buildMode||'旧版')+' · '+(n.builderVersion||'版本未知')}

let libraryCache=[],libraryReady=false,libraryError='',libraryJob=null;
function collectNetworkLibrary(){return [...(Array.isArray(db.networkLibrary)?db.networkLibrary:[]),...libraryCache].filter(x=>x?.n?.graph)}
function libraryDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('be-network-library',1);q.onupgradeneeded=()=>q.result.createObjectStore('versions',{keyPath:'key'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('版本库被其他窗口占用'))})}
async function syncNetworkLibrary(extra=[]){if(libraryJob){await libraryJob;return syncNetworkLibrary(extra)}libraryJob=(async()=>{let conn;try{const all=[...collectNetworkLibrary(),...extra];for(const c of db.cards){if(c.network?.graph)all.push({n:c.network,label:c.name+' 正式网络'});for(const k of ['associationTrial','nodeTrial','layeredTrial'])for(const v of ['baseline','candidate'])if(c[k]?.[v]?.graph)all.push({n:c[k][v],label:c.name+' '+k+' '+v})}conn=await libraryDB();const tx=conn.transaction('versions','readwrite'),store=tx.objectStore('versions');const done=new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('版本库事务中止'))});for(const x of all){if(!x?.n?.graph)continue;const key=JSON.stringify([x.n.source,x.n.graph,x.n.layers??null]);store.put({key,n:x.n,label:x.label||'历史版本'})}const req=store.getAll();await done;libraryCache=req.result;libraryReady=true;libraryError='';if(Array.isArray(db.networkLibrary)){const old=db.networkLibrary;delete db.networkLibrary;try{await save()}catch(e){db.networkLibrary=old;libraryError='旧版本库迁移后保存失败：'+e.message}}}catch(e){libraryError=e.message||String(e);libraryReady=true;throw e}finally{conn?.close()}})();try{await libraryJob}finally{libraryJob=null}}
function archiveNetworks(){syncNetworkLibrary().catch(e=>{libraryError=e.message||String(e)})}
function refreshLibrary(){syncNetworkLibrary().then(()=>{if(view==='persona')renderApp()}).catch(e=>{if(view==='persona')renderApp()})}
function libraryPanel(){const c=card(),list=networkChoices();return '<h2>人格网络版本库</h2><p class="meta">'+esc(libraryError?'版本库错误：'+libraryError:libraryReady?'版本库已加载':'版本库加载中…')+'</p><button onclick="refreshLibrary()">刷新版本库</button><p class="meta">独立保存已完成版本；同一原文下共 '+list.length+' 个可选配置。</p>'+networkPicker()+'<button onclick="document.getElementById(\'libraryFile\').click()">导入历史版本到库</button><input id="libraryFile" type="file" accept=".json,application/json" multiple hidden onchange="importNetworkLibrary(this)"><details><summary>查看全部版本</summary>'+list.map(x=>'<p>'+esc(networkLabel(x.n))+'<br><small>'+esc(x.label+' · '+(x.n.time||'时间未知'))+'</small></p>').join('')+'</details>'}
async function importNetworkLibrary(input){if(building||pending||reviewing)return;const c=card(),items=[],errors=[];for(const file of input.files){try{const q=JSON.parse(await file.text());const ns=q.card?.network?[q.card.network]:q.candidate?[q.baseline,q.candidate]:q.graph?[q]:q.stages?.length===3?[{source:q.source,graph:q.stages[2].graph,model:q.model,temperature:q.temperature,builderVersion:q.builderVersion,buildMode:'staged',time:q.time}]:[];if(!ns.length)throw Error('未找到完整网络');for(const n of ns){if(!n||n.source!==c.prompt)throw Error('原文不一致');n.graph=expandPersona(n.graph);validatePersona(n.graph,n.source);if(n.layers)validateFree(n.layers.free,n.graph.nodes);items.push({id:uid()+'-'+items.length,label:file.name,n})}}catch(e){errors.push(file.name+'：'+e.message)}}if(card()!==c)return alert('角色已切换，请重新导入');try{await syncNetworkLibrary(items);renderApp();alert('导入检查完成：'+items.length+' 个有效网络（重复自动合并）'+(errors.length?'；失败：'+errors.join('；'):''))}catch(e){alert('保存失败：'+e.message)}}

function networkChoices(){const c=card(),out=[],seen=new Set();function add(n,label){if(!Array.isArray(n?.graph?.nodes)||!Array.isArray(n?.graph?.edges)||n.source!==c.prompt)return;const key=JSON.stringify([n.graph,n.layers??null]);if(seen.has(key))return;seen.add(key);out.push({n,label})}for(const x of db.cards){if(x.prompt!==c.prompt)continue;const num=db.experimentNumbers[JSON.stringify([x.id,x.id===db.cid?db.mid:x.session?.mid||db.mid])]||'未开始';add(x.network,'实验 '+num);for(const [k,t] of [['associationTrial','关联候选'],['nodeTrial','节点候选'],['layeredTrial','三层候选']]){const a=x[k];add(a?.baseline,'实验 '+num+' '+t+'基准');if(a?.candidate?.layers&&Array.isArray(a.candidate.layers.enabled)&&Array.isArray(a.candidate.layers.free?.paths)){for(const [v,name] of [[[true,false,false],'仅明确'],[[true,true,false],'明确＋推测'],[[true,false,true],'明确＋自由'],[[true,true,true],'完整三层'],[[false,false,false],'仅节点']]){const n=clone(a.candidate);n.layers.enabled=v;add(n,'实验 '+num+' '+name)}}else add(a?.candidate,'实验 '+num+' '+t)}}for(const x of collectNetworkLibrary()){const n=x.n;if(n.layers&&Array.isArray(n.layers.enabled)&&Array.isArray(n.layers.free?.paths)){for(const v of [[true,false,false],[true,true,false],[true,false,true],[true,true,true],[false,false,false]]){const q=clone(n);q.layers.enabled=v;add(q,x.label)}}else add(n,x.label)}return out}
let componentChoices=[],nodeChoices=[],edgeChoices=[];
const nodeKey=n=>JSON.stringify([n.graph.base,n.graph.nodes,n.graph.rules]);
const edgeKey=n=>JSON.stringify([n.graph.edges,n.layers??null]);
function networkPicker(){const c=card();componentChoices=networkChoices();nodeChoices=[];const seen=new Set();for(const x of componentChoices){const k=nodeKey(x.n);if(seen.has(k))continue;seen.add(k);nodeChoices.push(x)}const current=c.network;const idx=current?.graph?nodeChoices.findIndex(x=>nodeKey(x.n)===nodeKey(current)):-1;return '<div style="text-align:left;margin:10px 0"><label>当前实验 '+experimentNumber()+' · 实际输入</label><p class="meta">'+esc(personaMode(c)==='original'?'原始人设（未使用网络）':networkLabel(current))+'</p><label>节点版本（含基础人格与语言规则）</label><select id="nodeVersion" onchange="refreshEdgeVersions()">'+nodeChoices.map((x,i)=>'<option value="'+i+'" '+(i===(idx<0?0:idx)?'selected':'')+'>'+esc(x.n.graph.nodes.length+' 节点 · '+(x.n.builderVersion||'未知')+' · '+(x.n.time||''))+'</option>').join('')+'</select><label>关联版本</label><select id="edgeVersion">'+edgeOptions(idx<0?0:idx,current)+'</select><button onclick="applyComponents()" '+(!nodeChoices.length||building||pending||reviewing?'disabled':'')+'>保存至当前实验</button><p class="meta">不创建新实验。仅列出与所选节点结构一致的关联版本；已有聊天保留，变更仅影响后续请求。</p></div>'}
function edgeOptions(i,current){const x=nodeChoices[i];edgeChoices=[];if(!x)return '';const seen=new Set();for(const y of componentChoices){if(nodeKey(y.n)!==nodeKey(x.n))continue;const k=edgeKey(y.n);if(seen.has(k))continue;seen.add(k);edgeChoices.push(y)}return '<option value="-1">无关联（仅节点）</option>'+edgeChoices.map((y,j)=>'<option value="'+j+'" '+(current?.graph&&nodeKey(current)===nodeKey(x.n)&&edgeKey(current)===edgeKey(y.n)?'selected':'')+'>'+esc(networkLabel(y.n)+' · '+(y.n.time||''))+'</option>').join('')}
function refreshEdgeVersions(){const el=$('edgeVersion');if(el)el.innerHTML=edgeOptions(Number($('nodeVersion').value),card().network)}
async function applyComponents(){if(building||pending||reviewing)return;const c=card(),x=nodeChoices[Number($('nodeVersion')?.value)],i=Number($('edgeVersion')?.value),y=edgeChoices[i];if(!x||i!==-1&&!y)return;const n=clone(x.n);if(y){n.graph.edges=clone(y.n.graph.edges);n.graph.issues=clone(y.n.graph.issues);if(y.n.layers)n.layers=clone(y.n.layers);else delete n.layers;n.associationVersion=y.n.time;n.associationBuilder=y.n.builderVersion}else{n.graph.edges=[];delete n.layers;n.graph.issues=[];n.associationVersion=null}n.nodeVersion=x.n.time;n.nodeBuilder=x.n.builderVersion;n.time=new Date().toISOString();n.buildMode='selected-components';try{validatePersona(n.graph,c.prompt);if(n.layers)validateFree(n.layers.free,n.graph.nodes)}catch(e){return alert(e.message)}if(!confirm('将 '+networkLabel(n)+' 保存至当前实验？'+(db.history.some(h=>h.cid===c.id)?'已有聊天将保留，后续消息使用新配置；该实验将包含不同网络条件。':'')))return;try{await syncNetworkLibrary();if(card()!==c||pending||reviewing||building)return;const old=c.network,mode=c.personaMode;const log=c.networkChanges||[];const record={time:n.time,previous:old?.time||null,nodeVersion:n.nodeVersion,associationVersion:n.associationVersion,nodes:n.graph.nodes.length,edges:n.graph.edges.length};c.network=n;c.personaMode='network';c.networkChanges=[...log,record];try{await save()}catch(e){c.network=old;c.personaMode=mode;c.networkChanges=log;throw e}archiveNetworks();renderApp()}catch(e){alert('未保存：'+e.message)}}
function experimentList(){return '<label>实验会话</label><select onchange="switchExperiment(this.value)">'+db.cards.map(c=>'<option value="'+esc(c.id)+'" '+(c.id===db.cid?'selected':'')+'>'+esc(c.name)+' · 实验 '+(db.experimentNumbers[JSON.stringify([c.id,c.id===db.cid?db.mid:c.session?.mid||db.mid])]||'未开始')+' · '+esc(personaMode(c)==='original'?'原始人设':networkLabel(c.network))+'</option>').join('')+'</select>'}
function experimentBusy(){return [window.__beSavePending()?'本地数据保存':null,pending?'聊天生成':null,reviewing?'认知回顾':null,building?'人格构建':null].filter(Boolean).join('、')}
function clearChat(){const busy=experimentBusy();if(busy)return alert('暂不能新建实验：'+busy+'仍在运行。如果长期无变化，可刷新页面后重试，已保存数据保留。');if(!confirm('复制当前角色与人格网络，创建独立实验？旧聊天及认知保留。'))return;forkExperiment()}
async function forkExperiment(network,mode){const busy=experimentBusy();if(busy){alert('暂不能新建实验：'+busy+'仍在运行');return false}const old=card(),oldSession=old.session,oldIds={cid:db.cid,mid:db.mid,pid:db.pid},oldCounter=db.experimentCounter,oldNumbers={...db.experimentNumbers},lengths=[db.cards.length,db.masks.length,db.presets.length];let p;try{storeExperiment();const {personaDraft,nodeTrial,associationTrial,layeredTrial,networkChanges,...base}=old;const c=clone(base),m=clone(mask());p=clone(preset());c.id=uid();m.id=uid();p.id=uid();if(keys[db.pid])keys[p.id]=keys[db.pid];if(network){c.network=clone(network);if(mode)c.personaMode=mode}const parentKey=pair(old,mask());if(!db.experimentNumbers[parentKey])db.experimentNumbers[parentKey]=++db.experimentCounter;c.parentExperiment=db.experimentNumbers[parentKey];c.parentCardId=old.id;delete c.dynamicStates;delete c.globalDynamicState;delete c.personDynamics;if(c.relationships){const d=c.relationships,pid=d.bindings?.[oldIds.mid];d.bindings=pid?{[m.id]:pid}:{};d.changes=[];d.revision=0}db.cards.push(c);db.masks.push(m);db.presets.push(p);db.cid=c.id;db.mid=m.id;db.pid=p.id;storeExperiment();db.experimentNumbers[pair(c,m)]=++db.experimentCounter;await save()}catch(e){db.cards.length=lengths[0];db.masks.length=lengths[1];db.presets.length=lengths[2];Object.assign(db,oldIds);db.experimentCounter=oldCounter;db.experimentNumbers=oldNumbers;if(oldSession===undefined)delete old.session;else old.session=oldSession;if(p)delete keys[p.id];alert('新实验创建失败，原实验已保留：'+(e.name==='QuotaExceededError'?'浏览器本地储存空间不足':e.message)+'。请在设置查看本地储存，不要清除旧数据。');return false}archiveNetworks();try{renderApp()}catch(e){alert('实验已保存，但页面显示失败：'+e.message)}return true}
function timeContext(c,m,now){if(c.timeEnabled===false)return '';const zone=c.timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone;const fmt=z=>new Intl.DateTimeFormat('zh-CN',{timeZone:z,dateStyle:'full',timeStyle:'short'}).format(now);const last=historyFor(c,m).filter(x=>x.time).at(-1);const gap=last?Math.max(0,Math.floor((now-new Date(last.time))/60000)):null;return '\n\n【线上聊天客观时间】用户设备时间：'+fmt(Intl.DateTimeFormat().resolvedOptions().timeZone)+'；角色当地时间（'+zone+'）：'+fmt(zone)+'；距上次已记录消息：'+(gap===null?'未知':gap+'分钟')+'。旧消息发生在过去，不要默认仍处于上次聊天时刻。自然理解时间，不必主动播报，不虚构已发生的离线事件。'}

function setRoleZone(){const z=prompt('角色时区（例如 Europe/Paris、Asia/Shanghai）',card().timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone);if(z===null)return;try{new Intl.DateTimeFormat('zh-CN',{timeZone:z}).format();card().timeZone=z;save();renderApp()}catch{alert('无效时区')}}
function openApp(v){if(v==='individual'){Object.assign(individualSelection,{root:null,cid:db.cid,mid:db.mid,query:''});relationEditing=null}if(v==='cognition'){v='individual';Object.assign(individualSelection,{root:null,cid:db.cid,mid:db.mid,tab:'belief',query:''})}view=v;shell.style.display='block';document.querySelector('main').style.display='none';try{renderApp();if(v==='persona')refreshLibrary()}catch(e){shell.innerHTML=header('页面错误')+'<p class="error">'+esc(e.name+': '+e.message)+'</p><p>请保留本地数据并反馈此错误。</p>'}}

const diaDefaults={enabled:false,persona:true,belief:false,fact:false,meaning:false,manualFact:false,manualBelief:false,reaction:false,format:'json',trace:true,factText:'',beliefText:'',reactionText:''};
function diaConfig(c=card()){return {...diaDefaults,...c.dia}}
function diaFormat(c,data){const f=diaConfig(c);if(!f.enabled||f.format==='json')return JSON.stringify(data);if(f.format==='compact'){const pack=v=>{if(Array.isArray(v)&&v.length&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){const keys=[...new Set(v.flatMap(Object.keys))];return {columns:keys,rows:v.map(x=>keys.map(k=>Object.hasOwn(x,k)?[x[k]]:[]))}}if(v&&typeof v==='object'&&!Array.isArray(v))return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,pack(x)]));return v};return '紧凑表：columns 为字段，rows 每格 [值] 表示存在，[] 表示缺失。\n'+JSON.stringify(pack(data))}return Object.entries(data).map(([k,v])=>'【'+k+'】\n'+(Array.isArray(v)?v.map(x=>x&&typeof x==='object'&&!Array.isArray(x)?Object.entries(x).map(([a,b])=>a+'：'+JSON.stringify(b)).join('；'):JSON.stringify(x)).join('\n'):JSON.stringify(v))).join('\n')}
function diaSections(c,m,a,number){const d=diaConfig(c),ev=eventsFor(number),out=[];const add=(name,value)=>out.push({name,content:typeof value==='string'?value:JSON.stringify(value)});if(d.persona)add('个体资料',personaContext(c));if(m.public&&m.prompt.trim())add('初始公开面具',m.prompt);if(d.belief)add('已有主观认知（可能错误，并非客观事实）',a.entries.filter(e=>e.status!=='撤销'));if(d.fact)add('已有经历记录（依据可能含模型整理，非自动核实）',ev.map(({id,title,event,time,turn,source})=>({id,title,event,time,turn,source})));if(d.meaning)add('已有经历的主观意义（不是客观事实）',ev.map(({id,meaning,links})=>({id,meaning,links})));if(d.manualFact&&d.factText.trim())add('人工实验事实（本实验内设定的经历）',d.factText);if(d.manualBelief&&d.beliefText.trim())add('人工实验认识（角色的主观看法）',d.beliefText);if(d.reaction&&d.reactionText.trim())add('人工反应经验（过去的表现或假设倾向，不是必须遵循的脚本）',d.reactionText);return out}
function diaPage(){const c=card(),d=diaConfig(c);const flags=[['enabled','启用 DIA 信息实验（关闭则沿用旧流程）'],['persona','基础人格资料（遵循人格输入模式）'],['belief','已有认知档案'],['fact','已有经历 · 事件'],['meaning','已有经历 · 主观意义'],['manualFact','手动事实记忆'],['manualBelief','手动主观认识'],['reaction','手动反应经验'],['trace','本地保存完整聊天请求及返回（含私密聊天，导出前请检查）']];shell.innerHTML=header('信息实验')+experimentList()+'<p class="meta">实验 '+experimentNumber()+' · 启用时须关闭认知评价；认知系统可独立控制自动回顾。旧档案不改写。手动材料不进入正式档案。</p>'+flags.map(([k,t])=>'<label><input style="width:auto" type="checkbox" id="dia_'+k+'" '+(d[k]?'checked':'')+'> '+t+'</label>').join('')+'<label>人格网络输入格式</label><select id="dia_format">'+[['json','原有 JSON'],['natural','结构化自然语言'],['compact','紧凑节点与关联']].map(([k,t])=>'<option value="'+k+'" '+(d.format===k?'selected':'')+'>'+t+'</option>').join('')+'</select>'+[['factText','事实记忆'],['beliefText','主观认识'],['reactionText','反应经验']].map(([k,t])=>'<label>'+t+'</label><textarea id="dia_'+k+'">'+esc(d[k])+'</textarea>').join('')+'<div class="actions"><button onclick="saveDia()">保存实验配置</button><button onclick="previewDia()">查看已保存信息区块</button><button onclick="readDiaTrace(false)">查看最近请求</button><button onclick="readDiaTrace(true)">导出完整请求</button></div><p id="status" class="error"></p><pre id="diaPreview" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre>'}
async function saveDia(){const busy=experimentBusy();if(busy)return alert('暂不能保存：'+busy);const c=card(),d=diaConfig(c);for(const k of Object.keys(diaDefaults))d[k]=typeof diaDefaults[k]==='boolean'?$('dia_'+k).checked:$('dia_'+k).value;if(!['json','natural','compact'].includes(d.format))return;if(d.enabled&&db.appraisalMode!=='off')return alert('请先在设置中关闭认知评价；认知系统开关独立。');const old=c.dia;if(historyFor().length&&JSON.stringify(d)!==JSON.stringify(diaConfig(c))&&!confirm('已有聊天保留；新配置仅影响后续消息，实验将包含不同条件。继续？'))return;c.dia=d;try{$('status').textContent='正在写入本地数据库…';await save();if(view==='dia'&&$('status'))$('status').textContent='已保存'}catch(e){c.dia=old;if(view==='dia'&&$('status'))$('status').textContent='保存失败：'+e.message}}
function previewDia(){try{const d=diaConfig();$('diaPreview').textContent=d.enabled?diaSections(card(),mask(),archive(),experimentNumber()).map(x=>'【'+x.name+'】\n'+x.content).join('\n\n'):'DIA 关闭，沿用旧流程。';}catch(e){$('status').textContent=e.message}}
function diaTraceDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('be-dia-trace',1);q.onupgradeneeded=()=>q.result.createObjectStore('requests',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('请求档案被其他窗口占用'))})}
async function diaTracePut(v){const conn=await diaTraceDB();try{await new Promise((resolve,reject)=>{const tx=conn.transaction('requests','readwrite');tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('请求档案事务中止'));tx.objectStore('requests').put(v)})}finally{conn.close()}}
async function readDiaTrace(download){const number=experimentNumber();try{const conn=await diaTraceDB();let rows;try{rows=await new Promise((resolve,reject)=>{const q=conn.transaction('requests','readonly').objectStore('requests').getAll();q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}finally{conn.close()}rows=rows.filter(x=>x.number===number).sort((a,b)=>a.time.localeCompare(b.time));if(download){const u=URL.createObjectURL(new Blob([JSON.stringify({experimentNumber:number,requests:rows},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='be-context-'+String(number).padStart(3,'0')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}else if(view==='dia')$('diaPreview').textContent=rows.length?JSON.stringify(rows.at(-1),null,2):'尚无请求记录';if(view==='dia')$('status').textContent=rows.length+' 条请求记录（仅本实验）'}catch(e){if(view==='dia')$('status').textContent='读取失败：'+e.message}}

const personaMode=c=>c.personaMode||'original';
const personaLabel=c=>({original:'原始',network:'网络',both:'并用'}[personaMode(c)]);
function segments(t){return t.split(/\n+/).filter(x=>x.trim()).map((text,i)=>({id:'S'+(i+1),text}))}
function expandPersona(g){
 if(!g||typeof g!=='object')throw Error('图谱格式错误');
 const extra=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
 const defaults={attributes:{},conditions:[],exceptions:[]};
 return {...g,base:g.base&&typeof g.base==='object'&&!Array.isArray(g.base)?JSON.stringify(g.base):g.base,nodes:Array.isArray(g.nodes)?g.nodes.map(n=>Array.isArray(n)?{...defaults,...extra(n[4]),id:n[0],name:n[1],content:n[2],sources:n[3]}:n):g.nodes,edges:Array.isArray(g.edges)?g.edges.map(e=>Array.isArray(e)?{conditions:[],exceptions:[],...extra(e[7]),id:e[0],from:e[1],to:e[2],relation:e[3],description:e[4],evidence:e[5],sources:e[6]}:e):g.edges,rules:Array.isArray(g.rules)?g.rules.map(r=>Array.isArray(r)?{content:r[0],sources:r[1]}:r):g.rules};
}
function validatePersona(g,source){
 if(!g||typeof g.base!=='string'||!Array.isArray(g.nodes)||!g.nodes.length||!Array.isArray(g.edges)||!Array.isArray(g.rules)||!Array.isArray(g.issues))throw Error('图谱格式不完整');
 const ids=new Set(), refs=new Set(segments(source).map(x=>x.id)), used=new Set(), warnings=[];
 function checkRefs(a){if(!Array.isArray(a)||!a.length)throw Error('缺少来源');for(const x of a){if(!refs.has(x))throw Error('无效来源 '+x);used.add(x)}}
 for(const n of g.nodes){if(typeof n.id!=='string'||ids.has(n.id)||typeof n.name!=='string'||typeof n.content!=='string')throw Error('节点格式或ID错误');ids.add(n.id);checkRefs(n.sources)}
 const connected=new Set(),edgeIds=new Set();for(const e of g.edges){if(typeof e.id!=='string'||edgeIds.has(e.id)||!Array.isArray(e.from)||!e.from.length||!Array.isArray(e.to)||!e.to.length||[...e.from,...e.to].some(x=>!ids.has(x))||typeof e.description!=='string'||!['explicit','inferred'].includes(e.evidence))throw Error('连接格式错误');edgeIds.add(e.id);checkRefs(e.sources);if(e.from.length===1&&e.to.length===1&&e.from[0]===e.to[0])warnings.push('自环连接：'+e.id+'（'+e.from[0]+'），请检查节点粒度');else for(const id of [...e.from,...e.to])connected.add(id)}
 for(let i=0;i<g.rules.length;i++){const rule=g.rules[i];const content=typeof rule==='string'?rule:rule?.content??rule?.rule??rule?.text??rule?.description??rule?.instruction??rule?.规范;const value=Array.isArray(content)&&content.every(x=>typeof x==='string')?content.join('\n'):content;if(typeof value!=='string'||!value.trim())throw Error('语言规范第 '+(i+1)+' 项无法识别：'+JSON.stringify(rule).slice(0,160));const supplied=typeof rule==='object'&&rule!==null?(rule.sources??rule.source??rule.refs??rule.source_ids):null;const rawRefs=Array.isArray(supplied)?supplied:typeof supplied==='string'?supplied.split(/[,，、\s]+/):[];const valid=[...new Set(rawRefs.filter(x=>refs.has(x)))];if(!valid.length||valid.length!==rawRefs.length||rule?.sourceUnverified)warnings.push('语言规范第 '+(i+1)+' 项来源待核对');if(valid.length)checkRefs(valid);g.rules[i]={...(typeof rule==='object'&&rule!==null?rule:{}),content:value,sources:valid,sourceUnverified:!valid.length||valid.length!==rawRefs.length||!!rule?.sourceUnverified};}
 const names=new Set();for(const n of g.nodes){if(names.has(n.name))warnings.push('可能重复：'+n.name);names.add(n.name)}
 return {unmapped:[...refs].filter(x=>!used.has(x)),warnings,total:refs.size,isolated:[...ids].filter(id=>!connected.has(id))};
}

];

function parseLayeredRelations(q,g,source,version){if(!Array.isArray(q.issues))throw Error('缺少issues数组');let edges;if(version===2){if(!Array.isArray(q.explicit)||!Array.isArray(q.inferred))throw Error('缺少明确或推测关联独立数组');edges=[...q.explicit.map(e=>[e,'explicit']),...q.inferred.map(e=>[e,'inferred'])].map(([e,type])=>{const x=expandPersona({edges:[e]}).edges[0];if(x.evidence!==type)throw Error('关联分类与数组不一致：'+x.id);return x})}else{if(!Array.isArray(q.edges))throw Error('缺少关联数组');edges=expandPersona({edges:q.edges}).edges}const test=clone(g);test.edges=edges;test.issues=q.issues;validatePersona(test,source);return {edges:test.edges,issues:q.issues}}

function recoverPersonaStage(){if(historyFor().length)return alert('请先新建实验再恢复构建');
 if(building||pending||reviewing)return;
 const c=card(),d=c.personaDraft;if(!d||d.source!==c.prompt||d.stages.length!==0)return;
 const candidates=[];
 for(const a of d.attempts){if(a.stage!==0||!a.raw)continue;try{const patch=JSON.parse(a.raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));const graph=mergePersonaStage(null,patch,0,d.source);candidates.push({a,patch,graph})}catch{}}
 if(!candidates.length){alert('没有通过校验的历史输出');return}
 const choices=candidates.map((x,i)=>(i+1)+'：'+x.graph.nodes.length+' 节点 / '+x.graph.rules.length+' 规则').join('\n');
 const choice=prompt('选择要恢复的历史输出（不调用API）：\n'+choices,String(candidates.length));if(choice===null)return;
 const picked=candidates[Number(choice)-1];if(!picked){alert('编号无效');return}
 d.stages.push({stage:0,time:new Date().toISOString(),graph:picked.graph,patch:picked.patch,recoveredFrom:picked.a.time});d.recoveryVersion='0.6.5.1';save();renderApp();$('status').textContent='已恢复第一阶段，无新增API请求。点击继续 / 重试进入第二阶段。';
}

    const graph=mergePersonaStage(i?d.stages[i-1].graph:null,patch,i,source);

async function runNodeTrial(){if(building||pending||reviewing)return;const c=card(),p={...preset()},n=c.network;if(!n||n.source!==c.prompt)return alert('请先准备有效网络');if(!confirm('发起一次节点专项审查请求？正式网络不变，已有节点专项候选将被替换。'))return;const baseline=clone(n),number=experimentNumber(),logs=usageFor(number),idx=logs.length,a={baseline,source:c.prompt,model:p.model,temperature:p.temperature,status:'pending',time:new Date().toISOString()};c.nodeTrial=a;building=true;let msg='';try{save();renderApp();if($('status'))$('status').textContent='正在生成节点候选，请等待 API 返回…';lastPersonaRaw=null;const raw=await request(p,[{role:'system',content:'你是虚构人格网络节点审查模块。逐段对照原文与现有节点，查漏、拆分复合信息，保留独立经历、感受、行为、需求、条件、程度、否定及语言示例的区别。例句不是已发生事件。不得虚构事实、机械切句、重复同义节点或强制数量。保留所有原节点ID；拆分时仅在原节点仍保留原关联适用的核心含义时替换，否则保留原节点并补充真正独立的遗漏信息。现有关联、基础人格及语言规则不改。新增节点用未使用的N编号。每项修改必须给出原文来源和理由。仅输出JSON对象 {addNodes:[],replaceNodes:[],reasons:[{id,reason}],issues:[]}。节点为对象，包含id,name,content,sources及必要的attributes,conditions,exceptions。sources为原文S编号数组。'}, {role:'user',content:JSON.stringify({source:segments(c.prompt),graph:baseline.graph})}],'persona',number);a.raw=raw;const patch=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));a.patch=patch;for(const k of ['addNodes','replaceNodes','reasons','issues'])if(!Array.isArray(patch[k]))throw Error('缺少 '+k);const g=clone(baseline.graph),ids=new Set(g.nodes.map(n=>n.id)),seen=new Set();for(const n of [...patch.replaceNodes,...patch.addNodes]){if(seen.has(n.id)||!patch.reasons.some(r=>r.id===n.id&&typeof r.reason==='string'&&r.reason.trim()))throw Error('重复节点或缺少理由 '+n.id);seen.add(n.id)}for(const n of patch.replaceNodes){const i=g.nodes.findIndex(x=>x.id===n.id);if(i<0)throw Error('未知节点 '+n.id);g.nodes[i]=n}for(const n of patch.addNodes){if(ids.has(n.id))throw Error('重复节点 '+n.id);ids.add(n.id);g.nodes.push(n)}g.issues=patch.issues;validatePersona(g,c.prompt);if(c.network?.time!==baseline.time||c.prompt!==a.source||!db.cards.includes(c))throw Error('基准已改变');a.candidate={...baseline,graph:g,time:new Date().toISOString(),builderVersion:'0.6.9',buildMode:'node-refinement',model:p.model,temperature:p.temperature};a.status='ok';archiveNetworks();msg='节点候选已完成，原网络不变。'}catch(e){a.status='failed';a.error=e.message;a.raw??=lastPersonaRaw;msg='节点实验失败：'+e.message}finally{a.input=logs[idx]?.input??null;a.output=logs[idx]?.output??null;building=false;try{await save()}catch(e){msg+='；本地保存失败：'+e.message}if(view==='persona'){renderApp();$('status').textContent=msg}}}

async function buildPersona(){if(building||pending||reviewing)return;if(historyFor().length)return alert('请先新建实验，避免覆盖已有聊天的人格网络');const c=card(),source=c.prompt,p={...preset()};if(!source.trim()){alert('请先保存角色卡');return}if(!confirm('将角色卡全文发送至当前API构建人格网络？可能消耗较多token。'))return;building=true;renderApp();$('status').textContent='构建中…';try{const raw=await request(p,[{role:'system',content:"你是虚构角色的人格网络构建器。输入为完整角色卡的编号片段。目标是构建可独立调用、相互关联的信息网络，不是主题摘要、心理诊断或行为脚本。一次请求内完成全文理解、关联驱动的节点构建、全局审查。只输出最终完整JSON。\n\n一、通读全文，识别角色所拥有的信息及其联系。日常生活、兴趣、地点、物品、人物、感官、经历、价值观、心声和对话示例与心理冲突同等重要，不以情绪强烈程度决定保留优先级。base仅写简短身份锚点。\n\n二、同步构建节点与关联。发现一项信息时，考虑它能否被独立回忆、独立关联、独立变化，或有独立成立条件；若能，则独立成节点。发现跨段落联系时，若现有节点过于宽泛，就拆开相关部分再建立连接，而不是在复合节点的描述中埋藏联系。允许合理的复合属性；不强制数量、分类或每个节点都有边。每个节点保持原意、程度词、频率、否定、条件、例外、主体、时间与不确定性。尤其检查原文的生活细节、独立爱好、不同人物、具体经历、个人赋予事物的意义。示例心声及对话逐个理解其心理与价值信息，标注其为示例而非已发生事件；语言规则单列rules。区分创作者设定、角色已知信息、角色自我解释与客观事实。不要增加诊断、强化情绪或用概括性心理标签替代原文。\n\n三、全局关联与原文审查。重新遍历各节点及原文片段，重点寻找尚未显式建边的跨域联系、比喻、条件、例外、共同作用、价值冲突。explicit表示原文明示的关系，而非仅两个端点都存在；inferred表示有依据但未明示的可能联系，描述中保留不确定性。不得虚构因果、强制联想或未来行为。对照每个有独立意义的原文片段，补齐遗漏、重复、错误引用及悬空边。矛盾保留不同说法，issues指出具体原文编号，不擅自裁决。标题和纯格式行可不生成节点。引用不等于完整覆盖，不虚报覆盖率。\n\n独立示范（不是输入角色资料，不得照搬数据）：\nS1 她喜欢柔软棉布，因为粗糙布料令她不舒服。通常自己缝衣服。\nS2 她喜欢画植物，偶尔会把画送给朋友。\nS3 她不喜欢黏稠的粥，觉得口感像湿布贴在皮肤上。\nS4 她认为为朋友花时间制作东西是一种关心。\nS5 心声示例：朋友说最近很忙。她想等对方有空，而不是催促。\n错误做法：把S1压成“穿衣审美”，把S2、S4压成“艺术与人际”。这样S3的跨感官比喻、S4的赠礼意义就无法独立连接。\n正确做法：拆分粗糙布料不适、棉布偏好、缝衣习惯；分开绘画兴趣、赠画行为、时间与关心的个人意义；把黏稠粥的口感和湿布触感的比喻明确建边。S5可提取示例中的体谅对方时间、克制催促，不声称朋友真的很忙。赠画与时间关心之间的具体动机属于推断，除非原文明说。\n紧凑输出协议：JSON顶层为base,nodes,edges,rules,issues。nodes每项为[id,名称,内容,来源编号数组,可选扩展对象]。edges每项为[id,起点ID数组,终点ID数组,关系,描述,证据类型,来源编号数组,可选扩展对象]。rules每项为[规范文本,来源编号数组]。issues可为字符串或含description及sources的对象。扩展对象仅在确实需要时填写attributes、conditions、exceptions；无特殊内容则省略，程序会补默认字段。条件、例外也可直接保留在内容中，不能为了压缩而遗漏。证据类型使用explicit或inferred。编号保持N1、E1、S1格式。禁止用相同节点作为单一边的两端来替代拆解。原文中的非自愿或伤害性行为仅作非露骨的叙事事实、风险与心理冲突描述，不将角色的自我辩解视为客观无害或同意，不生成实施行为的指令。\n格式示范（只展示部分独立示例数据，不得照搬）：\n{\"base\":\"示例角色\",\"nodes\":[[\"N1\",\"粗糙布料不适\",\"粗糙布料令她不舒服\",[\"S1\"]],[\"N2\",\"柔软棉布偏好\",\"喜欢柔软棉布\",[\"S1\"]],[\"N3\",\"赠画习惯\",\"偶尔把画送给朋友\",[\"S2\"]],[\"N4\",\"时间与关心\",\"认为为朋友花时间制作东西是一种关心\",[\"S4\"]]],\"edges\":[[\"E1\",[\"N1\"],[\"N2\"],\"影响偏好\",\"粗糙布料不适使她喜欢柔软棉布\",\"explicit\",[\"S1\"]],[\"E2\",[\"N3\"],[\"N4\"],\"可能的个人意义\",\"赠画可能体现以制作时间表达关心的观念，具体动机未明确\",\"inferred\",[\"S2\",\"S4\"]]],\"rules\":[],\"issues\":[]}\n只输出完整JSON，保持全部有意义的信息与有依据的关联，不因字段压缩而减少信息。"},{role:'user',content:JSON.stringify(segments(source))}],'persona');lastPersonaRaw=raw;const g=expandPersona(JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,'')));lastPersonaRaw=raw;validatePersona(g,source);if(c.prompt!==source||!db.cards.includes(c))throw Error('构建期间角色卡已改变');c.network={source,graph:g,model:p.model,temperature:p.temperature,builderVersion:'0.6.4',time:new Date().toISOString()};await save();archiveNetworks();finishGeneration('ok');if(view==='persona'){renderApp();$('status').textContent='构建完成，请检查来源和待确认事项'}}catch(e){finishGeneration('failed',e.message);if(view==='persona')$('status').textContent='构建失败（旧网络保留）：'+e.message}finally{building=false;if(view==='persona'){const msg=$('status').textContent;renderApp();$('status').textContent=msg}}}

async function request(p,messages,kind='chat',number=experimentNumber(),traceMeta=null){const url=new URL(p.url);if(url.protocol!=='https:'||!p.model)throw Error('请配置 HTTPS API 和模型');const endpoint=url.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'')+'/chat/completions';const headers={'Content-Type':'application/json'};if(keys[p.id])headers.Authorization='Bearer '+keys[p.id];const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),kind==='persona'?240000:90000);const log={kind,time:new Date().toISOString(),model:p.model,status:'pending',input:null,output:null};const trace=traceMeta?{id:uid(),number,time:log.time,kind,meta:traceMeta,request:{model:p.model,temperature:p.temperature,messages},status:'pending'}:null;if(trace)log.traceId=trace.id;usageFor(number).push(log);showGeneration(requestLabel(kind));try{await save();const res=await fetch(endpoint,{method:'POST',headers,signal:ctrl.signal,body:JSON.stringify({model:p.model,temperature:p.temperature,messages})});if(!res.ok)throw Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));const data=await res.json(),reply=data.choices?.[0]?.message?.content;if(trace)trace.response=data;log.input=data.usage?.prompt_tokens??null;log.output=data.usage?.completion_tokens??null;log.finishReason=data.choices?.[0]?.finish_reason??null;if(kind==='persona'&&log.finishReason==='length'){lastPersonaRaw=typeof reply==='string'?reply:null;throw Error('模型达到输出长度限制，原始输出可导出')}if(typeof reply!=='string')throw Error('API 未返回文本');log.status='ok';finishGeneration('received');return reply}catch(e){log.status='failed';finishGeneration('failed',e.name==='AbortError'?'请求超时':e.message);throw e}finally{clearTimeout(timer);if(trace){trace.status=log.status;trace.usage={input:log.input,output:log.output,finishReason:log.finishReason};try{await diaTracePut(trace)}catch(e){log.traceError=e.message||String(e)}}await save()}}
const schema='仅返回 JSON 对象 {"updates":[{"id":"已有条目ID或空字符串","title":"自主命名","content":"当前主观认知","source":"信息来源","certainty":"自主描述确信程度","status":"当前状态，如相信、怀疑、撤销","reason":"变化原因及主观归因，可未知","evidence":"相关交流或依据"}]}。以角色第一人称叙述，保留有意义的细节。content仅写当前理解，reason重点写变化原因而非重复当前内容，evidence保留原始依据。允许空数组。不得删除历史。合并或拆分时可撤销旧条目并新增条目。';
function applyUpdates(a,raw){const parsed=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(!Array.isArray(parsed.updates))throw Error('认知格式错误');const next=JSON.parse(JSON.stringify(a));for(const u of parsed.updates){if(!u||typeof u.title!=='string'||typeof u.content!=='string')throw Error('认知条目格式错误');const old=u.id?next.entries.find(e=>e.id===u.id):null;if(u.id&&!old)throw Error('未知认知条目');const e={id:old?.id||uid(),title:u.title,content:u.content,source:String(u.source||''),certainty:String(u.certainty||''),status:String(u.status||'相信')};if(old)next.entries[next.entries.indexOf(old)]=e;else next.entries.push(e);next.events.push({id:e.id,time:new Date().toISOString(),before:old||null,after:e,reason:String(u.reason||''),evidence:String(u.evidence||'')})}Object.assign(a,next)}
async function initialize(p,c,m,a){if(a.initialized)return;if(m.prompt.trim()){const raw=await request(p,[{role:'system',content:'你是独立的虚构角色认知初始化模块，不是聊天角色。根据角色设定、关系和开场情境组织初始认知。'+(m.public?'完整公开：将面具全部信息组织进档案。':'部分公开：只筛选有合理依据认为角色已经知道的信息，不泄露其他内容。允许完全为空。')+schema},{role:'user',content:JSON.stringify({character:c.prompt,privateMask:m.prompt})}],'init',db.experimentNumbers[pair(c,m)]||experimentNumber());applyUpdates(a,raw)}a.initialized=true;await save();if(generationNotice?.state==='received')finishGeneration('ok')}
async function review(p,c,m,a){const hist=historyFor(c,m),turns=hist.filter(x=>x.role==='assistant').length;if(turns<=a.cursor)return;const number=db.experimentNumbers[pair(c,m)]||experimentNumber(),ev=eventsFor(number),delta=hist.slice(a.cursor*2),unified=delta.some(x=>x.role==='assistant'&&x.appraisalMode==='simple');const extra=unified?' 同一次回顾同时整理个人经历。JSON增加 events 数组，每项包含 title,event,meaning,links,evidence,turn（绝对轮数）。仅记录有持续意义且未重复的经历，meaning以角色第一人称表达，推断须明确不确定性，不编造未表达的心理活动。links仅使用已有认知ID或本次新增条目的标题。允许空数组。':'';

async function sendMessage(){const busy=experimentBusy();if(busy)return alert('暂不能发送：'+busy);const p={...preset()},c={...card()},m={...mask()},msg=$('message').value.trim();if(!msg)return;const sentAt=new Date();const number=experimentNumber(),mode=db.appraisalMode,appraisal=mode==='old';const enabled=db.cogEnabled,a=archive(pair(c,m)),dia=diaConfig(c);if(dia.enabled&&mode!=='off'){alert('DIA 实验须关闭认知评价');return}pending=true;$('send').disabled=true;$('status').textContent='生成中…';try{if(enabled)await initialize(p,c,m,a);const prior=historyFor(c,m).map(({role,content})=>({role,content}));const context=enabled?'\n\n【主观认知档案】'+JSON.stringify({entries:mode==='simple'?a.entries.filter(e=>e.status!=='撤销'):a.entries,history:mode==='simple'?undefined:a.events})+'\n结合已有认知与当前交流自主判断新信息是否符合预期、陌生或矛盾。未知不等于意外，察觉不等于必须表达。允许误解、怀疑和隐瞒，不为填充档案而提问。':(m.public?'\n\n【初始公开面具】'+m.prompt:'');const instruction=appraisal?'\n\n【即时认知评价】根据自身人格、经历、价值观、需求和关系背景理解事件的主观意义，注意主体、因果、多重含义、内在冲突与不确定性。不预设理想人格，不将成为恋人或推进亲密关系当成系统目标；允许人格驱动的强烈依恋和执着。内在愿望不必立即表达或行动，情感体验本身有价值。无需固定分析步骤。先形成角色的简短主观评价（普通事件可为空），再生成自然回复。输出仅为JSON对象 {"evaluation":"可为空的角色第一人称主观评价摘要","reply":"正式聊天回复，仍遵循气泡规则","event":null}。若有值得长期保留的事件，将event替换为 {"title":"标题","event":"事件经过","meaning":"第一人称主观意义，不重复经过","links":["已有认知条目ID，可为空"]}。不要编造事件或强制记录。JSON内换行须转义。外层JSON格式优先于全局气泡格式，气泡规则仅适用于reply字段。\n【已有重要经历】'+JSON.stringify(eventsFor(number).map(({title,event,meaning})=>({title,event,meaning})))+'\n避免重复记录同一经历。':mode==='simple'?'\n\n【自主评价】以自身人格、经历和已有认知为基础，自然地理解当下发生的事情。允许外界信息唤起自己的经历、观点、兴趣、情感与联想，并形成属于自己的主观判断。思考不必始终围绕对方展开，也不必将所有想法表达出来。按照自身人格与当下情境自然交流。\n【已有重要经历】'+JSON.stringify(eventsFor(number).map(({title,event,meaning})=>({title,event,meaning}))):'';const sections=dia.enabled?diaSections(c,m,a,number):null;const rel=relationInput(c,m),relSnap=relationSnapshot(c,m);if(sections&&rel)sections.push({name:'人物与当前关系',content:JSON.stringify(rel)});const system=basePrompt+'\n\n'+(sections?sections.map(x=>'【'+x.name+'】\n'+x.content).join('\n\n'):personaContext(c)+context+instruction+(rel?'\n\n【人物与当前关系】\n'+JSON.stringify(rel):''))+timeContext(c,m,sentAt);const dyn=dynamicsEnabled(c),beforeState=dyn?dynamicState(c,m):null;const raw=await request(p,[{role:'system',content:system+(dyn?dynamicPrompt(c,m,sentAt):'')},...prior,{role:'user',content:msg}],'chat',number,dia.enabled&&dia.trace?{config:dia,sections:sections.map(x=>x.name),personaVersion:c.network?.time||null,personaMode:personaMode(c),cogEnabled:enabled,relationship:relSnap}:null);let reply=raw,record=null,dynamicObj=dyn?parseDynamic(raw):null;if(dyn)reply=dynamicObj.reply;if(appraisal){let obj;try{obj=dynamicObj||JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''))}catch{throw Error('认知评价输出格式错误，未保存聊天；可关闭评价后重试（不会自动重试）')}if(typeof obj.reply!=='string'||!obj.reply.trim())throw Error('评价输出缺少正式回复');reply=obj.reply;const v=obj.event;if(v&&typeof v.title==='string'&&typeof v.event==='string'&&typeof v.meaning==='string'){record={id:uid(),time:new Date().toISOString(),turn:prior.filter(x=>x.role==='assistant').length+1,title:v.title,event:v.event,meaning:v.meaning,links:enabled&&Array.isArray(v.links)?v.links.filter(id=>a.entries.some(e=>e.id===id)):[],evidence:msg,evaluation:typeof obj.evaluation==='string'?obj.evaluation:''}}}const turn=prior.filter(x=>x.role==='assistant').length+1,now=new Date().toISOString(),prepared=dyn?prepareDynamics(c,m,dynamicObj,turn,now):null,live=db.cards.find(x=>x.id===c.id),oldRel=live.relationships,oldStates=live.dynamicStates,oldGlobal=live.globalDynamicState,oldPerson=live.personDynamics,oldLength=db.history.length,ev=eventsFor(number),oldEvLength=ev.length;if(prepared?.nextRel)live.relationships=prepared.nextRel;if(prepared?.nextState){const parts=splitDynamic(prepared.nextState);live.globalDynamicState=parts.global;live.personDynamics={...oldPerson,[dynamicScope(c,m)]:parts.person}}if(record)ev.push(record);db.history.push({cid:c.id,mid:m.id,role:'user',content:msg,time:sentAt.toISOString()},{cid:c.id,mid:m.id,role:'assistant',content:reply,presetId:p.id,model:p.model,temperature:p.temperature,personaMode:personaMode(c),personaVersion:c.network?.time||null,appraisalMode:mode,appraisalEnabled:mode!=='off',cogEnabled:enabled,dia:dia.enabled?clone(dia):null,relationship:relSnap,dynamic:dyn?{turn,before:beforeState,after:dynamicState(live,m),globalAfter:globalDynamic(live),personAfter:personDynamic(live,m),relationshipAfter:relationSnapshot(live,m),relationshipChanged:!!prepared.nextRel}:null,time:now});try{await save()}catch(e){db.history.length=oldLength;ev.length=oldEvLength;if(oldRel===undefined)delete live.relationships;else live.relationships=oldRel;if(oldStates===undefined)delete live.dynamicStates;else live.dynamicStates=oldStates;if(oldGlobal===undefined)delete live.globalDynamicState;else live.globalDynamicState=oldGlobal;if(oldPerson===undefined)delete live.personDynamics;else live.personDynamics=oldPerson;throw e}finishGeneration('ok');if(view==='chat')renderApp();if(enabled&&historyFor(c,m).filter(x=>x.role==='assistant').length-a.cursor>=db.cogInterval){try{if($('status'))$('status').textContent='认知回顾中…';await review(p,c,m,a)}catch(e){finishGeneration('failed',e.message);if($('status'))$('status').textContent='认知回顾失败，记录已保留：'+e.message}}}catch(e){finishGeneration('failed',e.message);if($('status'))$('status').textContent='请求失败：'+e.message}finally{pending=false;if($('send'))$('send').disabled=false;if(view==='chat'&&$('status')&&/^(生成中|认知回顾中)/.test($('status').textContent))$('status').textContent=''}}

(()=>{const version='09030';let checking=false,last='',latest='',deferred=false,offered='',busyBefore=false;function busy(){try{return !!(pending||reviewing||building||window.__beSavePending())}catch{return false}}function status(msg){last=msg;const el=document.getElementById('updateInfo');if(el)el.textContent='当前 V0.9.3 · 最新编号 '+(latest||'未知')+' · '+last}async function check(manual=false){if(checking||(!manual&&document.visibilityState==='hidden'))return;if(busy()){deferred=true;status('生成结束后检查');return}checking=true;deferred=false;try{const r=await fetch('./lab-version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const v=await r.json();if(typeof v.version!=='string'||!/^\d+$/.test(v.version))throw Error('版本文件无效');latest=v.version;status('检查于 '+new Date().toLocaleTimeString());if(Number(latest)>Number(version)){if(busy()){deferred=true;return}if((manual||offered!==latest)&&confirm('发现新版本 '+latest+'。现在更新？保留本地聊天和角色卡。')){const target=new URL('./lab.html',location.href);target.searchParams.set('v',latest);location.replace(target.href)}else offered=latest}else if(manual)alert('当前已是最新版本')}catch(e){status('检查失败：'+e.message)}finally{checking=false}}window.checkBeUpdate=check;document.addEventListener('visibilitychange',()=>check());window.addEventListener('pageshow',()=>check());window.addEventListener('focus',()=>check());check();setInterval(()=>check(),15000);setInterval(()=>{const b=busy();if((busyBefore||deferred)&&!b)check();busyBefore=b;if(last)status(last)},1000)})();
</script>
<script>
(async function bootBe(){
 const main=document.querySelector('main'),shell=document.getElementById('shell');main.style.pointerEvents='none';shell.style.display='block';shell.textContent='正在读取本地数据库…';
 let conn,revision=0,stored='',pending=0,tail=Promise.resolve(),conflict=false,lastError='';
 const get=()=>new Promise((resolve,reject)=>{const tx=conn.transaction('state','readonly'),q=tx.objectStore('state').get('main');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);tx.onabort=()=>reject(tx.error||Error('读取事务中止'))});
 function write(raw,expected){return new Promise((resolve,reject)=>{let err;const tx=conn.transaction('state','readwrite'),store=tx.objectStore('state'),q=store.get('main');q.onsuccess=()=>{const actual=q.result?.revision||0;if(actual!==expected){conflict=true;err=Error('另一个窗口已修改数据库，请刷新后重试');tx.abort();return}store.put({id:'main',raw,revision:expected+1})};tx.oncomplete=()=>resolve(expected+1);tx.onabort=()=>reject(err||tx.error||Error('本地数据库写入中止'));tx.onerror=()=>reject(err||tx.error||Error('本地数据库写入失败'))})}
 function report(e){const msg=e.message||String(e);if(msg!==lastError){lastError=msg;alert('本地保存失败：'+msg+'。此前已确认保存的数据仍保留；请不要清除缓存。')}}
 try{
 conn=await new Promise((resolve,reject)=>{const q=indexedDB.open('be-main-state',1);q.onupgradeneeded=()=>q.result.createObjectStore('state',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('数据库被其他窗口占用，请关闭其他 be 窗口后刷新'))});
 conn.onversionchange=()=>{conflict=true;conn.close();alert('数据库版本已变化，请刷新 be')};
 let row=await get();if(!row){const raw=localStorage.getItem('be-lab-v050');if(raw!==null){const parsed=JSON.parse(raw);if(!parsed||!(parsed.format==='be-pool-v1'?Array.isArray(parsed.pool)&&parsed.data:Array.isArray(parsed.cards)&&Array.isArray(parsed.presets)))throw Error('旧数据库格式异常，未覆盖原数据');await write(raw,0);row=await get();if(!row||row.raw!==raw)throw Error('旧数据库迁移校验失败')}}
 if(row){if(typeof row.raw!=='string'||!Number.isInteger(row.revision))throw Error('数据库记录异常');stored=row.raw;revision=row.revision}
 window.__beLoadedRaw=row?.raw||'null';window.__beStoredSize=()=>stored.length;window.__beSavePending=()=>pending>0;
 window.__bePersist=raw=>{pending++;const p=tail.then(async()=>{if(conflict)throw Error('数据库已被其他窗口修改，请刷新后重试');revision=await write(raw,revision);stored=raw;lastError=''});const result=p.finally(()=>{pending--});tail=result.catch(e=>{report(e)});return result};
 document.addEventListener('click',e=>{if(pending&&e.target.closest?.('button')){e.preventDefault();e.stopImmediatePropagation();alert('正在保存本地数据，请保存完成后再操作')}},true);
 window.addEventListener('beforeunload',e=>{if(pending){e.preventDefault();e.returnValue=''}});
 let scriptError=null;const onError=e=>{scriptError=e.error||Error(e.message)};window.addEventListener('error',onError);try{for(const id of ['beCoreScript','beVersionScript']){const node=document.createElement('script');node.textContent=document.getElementById(id).textContent;document.body.appendChild(node);if(scriptError)throw scriptError}}finally{window.removeEventListener('error',onError)}
 shell.textContent='';shell.style.display='none';main.style.pointerEvents='';
 }catch(e){shell.textContent='本地数据库启动失败：'+(e.message||e)+'。旧数据未删除，请勿清除缓存。刷新后可重试。';main.style.pointerEvents='none'}
})();
</script></body></html>
