async function pullModels(){const status=$('modelStatus'),list=$('modelList');status.textContent='正在拉取…';try{const u=new URL($('pu').value.trim());if(u.protocol!=='https:')throw Error('请输入 HTTPS API 地址');const endpoint=u.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'').replace(/\/models$/,'')+'/models';const key=$('pk').value.trim();const res=await fetch(endpoint,{headers:key?{Authorization:'Bearer '+key}:{}});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const ids=[...new Set((data.data||[]).map(x=>x.id).filter(x=>typeof x==='string'))].sort();if(!ids.length)throw Error('接口未返回模型列表');list.innerHTML='<option value="">选择模型</option>'+ids.map(id=>'<option value="'+esc(id)+'">'+esc(id)+'</option>').join('');list.hidden=false;list.value=$('pm').value;status.textContent='已获取 '+ids.length+' 个模型，请选择后保存预设'}catch(e){status.textContent='拉取失败：'+e.message+'。请检查接口、Key 或跨域限制，也可手动填写模型。'}}

function newCard(){saveCard();const c={id:uid(),name:'新角色',prompt:''};db.cards.push(c);db.cid=c.id;save();renderApp()}
function deleteCard(){if(db.cards.length<2||!confirm('删除当前角色卡？'))return;db.cards=db.cards.filter(c=>c.id!==db.cid);db.cid=db.cards[0].id;save();renderApp()}
function clearChat(){if(pending||reviewing||!confirm('开始新实验？清空当前角色与面具的聊天和认知。'))return;const c=card(),m=mask();db.history=db.history.filter(x=>x.cid!==c.id||x.mid!==m.id);delete db.cognition[pair()];save();renderApp()}
function clearCognition(){if(pending||reviewing||!confirm('清空当前认知档案？聊天记录保留。'))return;delete db.cognition[pair()];save();renderApp()}
function exportChat(){const p=preset();const data={exportedAt:new Date().toISOString(),preset:Object.fromEntries(Object.entries(p).filter(([k])=>k!=='savedKey')),card:card(),mask:mask(),cognition:archive(),cogEnabled:db.cogEnabled,cogInterval:db.cogInterval,messages:historyFor()};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='be-experiment.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function request(p,messages){const url=new URL(p.url);if(url.protocol!=='https:'||!p.model)throw Error('请配置 HTTPS API 和模型');const endpoint=url.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'')+'/chat/completions';const headers={'Content-Type':'application/json'};if(keys[p.id])headers.Authorization='Bearer '+keys[p.id];const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),90000);try{const res=await fetch(endpoint,{method:'POST',headers,signal:ctrl.signal,body:JSON.stringify({model:p.model,temperature:p.temperature,messages})});if(!res.ok)throw Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));const data=await res.json(),reply=data.choices?.[0]?.message?.content;if(typeof reply!=='string')throw Error('API 未返回文本');return reply}finally{clearTimeout(timer)}}
const schema='仅返回 JSON 对象 {"updates":[{"id":"已有条目ID或空字符串","title":"自主命名","content":"当前主观认知","source":"信息来源","certainty":"自主描述确信程度","status":"当前状态，如相信、怀疑、撤销","reason":"变化原因及主观归因，可未知","evidence":"相关交流或依据"}]}。允许空数组。不得删除历史。合并或拆分时可撤销旧条目并新增条目。';
function applyUpdates(a,raw){const parsed=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(!Array.isArray(parsed.updates))throw Error('认知格式错误');const next=JSON.parse(JSON.stringify(a));for(const u of parsed.updates){if(!u||typeof u.title!=='string'||typeof u.content!=='string')throw Error('认知条目格式错误');const old=u.id?next.entries.find(e=>e.id===u.id):null;if(u.id&&!old)throw Error('未知认知条目');const e={id:old?.id||uid(),title:u.title,content:u.content,source:String(u.source||''),certainty:String(u.certainty||''),status:String(u.status||'相信')};if(old)next.entries[next.entries.indexOf(old)]=e;else next.entries.push(e);next.events.push({id:e.id,time:new Date().toISOString(),before:old||null,after:e,reason:String(u.reason||''),evidence:String(u.evidence||'')})}Object.assign(a,next)}
async function initialize(p,c,m,a){if(a.initialized)return;if(m.prompt.trim()){const raw=await request(p,[{role:'system',content:'你是独立的虚构角色认知初始化模块，不是聊天角色。根据角色设定、关系和开场情境组织初始认知。'+(m.public?'完整公开：将面具全部信息组织进档案。':'部分公开：只筛选有合理依据认为角色已经知道的信息，不泄露其他内容。允许完全为空。')+schema},{role:'user',content:JSON.stringify({character:c.prompt,privateMask:m.prompt})}]);applyUpdates(a,raw)}a.initialized=true;save()}
async function review(p,c,m,a){const hist=historyFor(c,m),turns=hist.filter(x=>x.role==='assistant').length;if(turns<=a.cursor)return;const raw=await request(p,[{role:'system',content:'维护虚构角色对用户的主观认知。仅依据角色设定、已有认知和新增对话。允许未知、误解、欺骗、怀疑、矛盾和错误归因。区分用户自述、观察、推测；角色自己的猜测不是事实。保留旧认知和错误原因，不总结教训或改变行为策略。不要强制更新。'+schema},{role:'user',content:JSON.stringify({character:c.prompt,entries:a.entries,history:a.events,dialogue:hist.slice(a.cursor*2).map(({role,content})=>({role,content}))})}]);applyUpdates(a,raw);a.cursor=turns;save()}
async function manualReview(){if(pending||reviewing||!db.cogEnabled)return;reviewing=true;const p={...preset()},c={...card()},m={...mask()},a=archive(pair(c,m));try{await initialize(p,c,m,a);await review(p,c,m,a);if(view==='cognition')renderApp()}catch(e){if($('status'))$('status').textContent='回顾失败：'+e.message}finally{reviewing=false;if(view==='cognition'&&$('status')&&!$('status').textContent)renderApp()}}
async function sendMessage(){if(pending||reviewing)return;const p={...preset()},c={...card()},m={...mask()},msg=$('message').value.trim();if(!msg)return;const enabled=db.cogEnabled,a=archive(pair(c,m));pending=true;$('send').disabled=true;$('status').textContent='生成中…';try{if(enabled)await initialize(p,c,m,a);const prior=historyFor(c,m).map(({role,content})=>({role,content}));const context=enabled?'\n\n【主观认知档案】'+JSON.stringify({entries:a.entries,history:a.events})+'\n结合已有认知与当前交流自主判断新信息是否符合预期、陌生或矛盾。未知不等于意外，察觉不等于必须表达。允许误解、怀疑和隐瞒，不为填充档案而提问。':(m.public?'\n\n【初始公开面具】'+m.prompt:'');const reply=await request(p,[{role:'system',content:basePrompt+'\n\n'+c.prompt+context},...prior,{role:'user',content:msg}]);db.history.push({cid:c.id,mid:m.id,role:'user',content:msg},{cid:c.id,mid:m.id,role:'assistant',content:reply,presetId:p.id,model:p.model,temperature:p.temperature,time:new Date().toISOString()});save();if(view==='chat')renderApp();if(enabled&&historyFor(c,m).filter(x=>x.role==='assistant').length-a.cursor>=db.cogInterval){try{if($('status'))$('status').textContent='认知回顾中…';await review(p,c,m,a)}catch(e){if($('status'))$('status').textContent='认知回顾失败，记录已保留：'+e.message}}}catch(e){if($('status'))$('status').textContent='请求失败：'+e.message}finally{pending=false;if($('send'))$('send').disabled=false;if(view==='chat'&&$('status')&&/^(生成中|认知回顾中)/.test($('status').textContent))$('status').textContent=''}}
document.addEventListener('touchmove',e=>{if(shell.style.display==='block')e.stopImmediatePropagation()},{capture:true,passive:true});
</script><script>
(()=>{const version='058';let checking=false;async function check(){if(checking||document.visibilityState==='hidden'||pending||reviewing)return;checking=true;try{const r=await fetch('./lab-version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();if(v.version!==version&&typeof v.version==='string'&&/^\d+$/.test(v.version)){const target=new URL('./lab.html',location.href);target.searchParams.set('v',v.version);if(location.href!==target.href&&confirm('发现新版本。现在更新？聊天记录和角色卡将保留，已保存的 API Key 将保留。'))location.replace(target.href)}}catch{}finally{checking=false}}document.addEventListener('visibilitychange',check);window.addEventListener('pageshow',check);check();setInterval(check,60000)})();
