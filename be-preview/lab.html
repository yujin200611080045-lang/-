const personaMode=c=>c.personaMode||'original';
const personaLabel=c=>({original:'原始',network:'网络',both:'并用'}[personaMode(c)]);
function segments(t){return t.split(/\n+/).filter(x=>x.trim()).map((text,i)=>({id:'S'+(i+1),text}))}
function expandPersona(g){
 if(!g||typeof g!=='object')throw Error('图谱格式错误');
 const extra=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
 const defaults={attributes:{},conditions:[],exceptions:[]};
 return {...g,base:g.base&&typeof g.base==='object'&&!Array.isArray(g.base)?JSON.stringify(g.base):g.base,nodes:Array.isArray(g.nodes)?g.nodes.map(n=>Array.isArray(n)?{...defaults,...extra(n[4]),id:n[0],name:n[1],content:n[2],sources:n[3]}:n):g.nodes,edges:Array.isArray(g.edges)?g.edges.map(e=>Array.isArray(e)?{conditions:[],exceptions:[],...extra(e[7]),id:e[0],from:e[1],to:e[2],relation:e[3],description:e[4],evidence:e[5],sources:e[6]}:e):g.edges,rules:Array.isArray(g.rules)?g.rules.map(r=>Array.isArray(r)?{content:r[0],sources:r[1]}:r):g.rules};
}
function validatePersona(g,source){
 if(!g||typeof g.base!=='string'||!Array.isArray(g.nodes)||!g.nodes.length||!Array.isArray(g.edges)||!Array.isArray(g.rules)||!Array.isArray(g.issues))throw Error('图谱格式不完整');
 const ids=new Set(), refs=new Set(segments(source).map(x=>x.id)), used=new Set(), warnings=[];
 function checkRefs(a){if(!Array.isArray(a)||!a.length)throw Error('缺少来源');for(const x of a){if(!refs.has(x))throw Error('无效来源 '+x);used.add(x)}}
 for(const n of g.nodes){if(typeof n.id!=='string'||ids.has(n.id)||typeof n.name!=='string'||typeof n.content!=='string')throw Error('节点格式或ID错误');ids.add(n.id);checkRefs(n.sources)}
 const connected=new Set(),edgeIds=new Set();for(const e of g.edges){if(typeof e.id!=='string'||edgeIds.has(e.id)||!Array.isArray(e.from)||!e.from.length||!Array.isArray(e.to)||!e.to.length||[...e.from,...e.to].some(x=>!ids.has(x))||typeof e.description!=='string'||!['explicit','inferred'].includes(e.evidence))throw Error('连接格式错误');edgeIds.add(e.id);checkRefs(e.sources);if(e.from.length===1&&e.to.length===1&&e.from[0]===e.to[0])warnings.push('自环连接：'+e.id+'（'+e.from[0]+'），请检查节点粒度');else for(const id of [...e.from,...e.to])connected.add(id)}
 for(let i=0;i<g.rules.length;i++){const rule=g.rules[i];const content=typeof rule==='string'?rule:rule?.content??rule?.rule??rule?.text??rule?.description??rule?.instruction??rule?.规范;const value=Array.isArray(content)&&content.every(x=>typeof x==='string')?content.join('\n'):content;if(typeof value!=='string'||!value.trim())throw Error('语言规范第 '+(i+1)+' 项无法识别：'+JSON.stringify(rule).slice(0,160));const supplied=typeof rule==='object'&&rule!==null?(rule.sources??rule.source??rule.refs??rule.source_ids):null;const rawRefs=Array.isArray(supplied)?supplied:typeof supplied==='string'?supplied.split(/[,，、\s]+/):[];const valid=[...new Set(rawRefs.filter(x=>refs.has(x)))];if(!valid.length||valid.length!==rawRefs.length||rule?.sourceUnverified)warnings.push('语言规范第 '+(i+1)+' 项来源待核对');if(valid.length)checkRefs(valid);g.rules[i]={...(typeof rule==='object'&&rule!==null?rule:{}),content:value,sources:valid,sourceUnverified:!valid.length||valid.length!==rawRefs.length||!!rule?.sourceUnverified};}
 const names=new Set();for(const n of g.nodes){if(names.has(n.name))warnings.push('可能重复：'+n.name);names.add(n.name)}
 return {unmapped:[...refs].filter(x=>!used.has(x)),warnings,total:refs.size,isolated:[...ids].filter(id=>!connected.has(id))};
}
function personaContext(c){const mode=personaMode(c);if(mode==='original')return c.prompt;if(!c.network||c.network.source!==c.prompt)throw Error('人格网络缺失或原文已变更，请重新构建或切回原始人设');const g=c.network.graph;validatePersona(g,c.prompt);const data={base:g.base,nodes:g.nodes.map(({sources,...n})=>n),edges:g.edges.map(({sources,...e})=>e),rules:g.rules.map(r=>r.content),issues:g.issues};return (mode==='both'?c.prompt+'\n\n':'')+'【人格网络：推断不是确定事实，关联不是必然行为】\n'+JSON.stringify(data)}

const stageNames=['信息提取','关联构建','独立审查'];
const stageProtocol='只输出完整JSON。节点数组项为[id,名称,内容,来源编号数组,可选扩展对象]；边数组项为[id,起点ID数组,终点ID数组,关系,描述,explicit或inferred,来源编号数组,可选扩展对象]；规则项为[规范文本,来源编号数组]。扩展对象可含attributes、conditions、exceptions。来源必须是真实S编号，节点N编号、边E编号唯一。保留程度、条件、例外、主观解释与事实的差别。涉及伤害或非自愿行为仅作非露骨的叙事事实及心理冲突记录，不提供实施指令，不将自我辩解视作同意或无害。';
const stagePrompts=[
'你只负责信息提取，不建立边，不作人格总评。通读全文后逐段提取每个独立可回忆、可关联、可变化的信息。日常生活与心理冲突同等重要。独立爱好、人物、物品、地点、感官体验、经历、价值、心声各自保留。示例标注为示例，不当作实际事件。能独立参与联想的信息不要合并为主题摘要。保留原文程度与主体。基础身份简短；语言规范单列。输出{base,nodes,rules,issues}，其中base必须为字符串，nodes、rules、issues必须为数组，不输出edges。'+stageProtocol,
'你只负责关联构建。输入为完整编号原文及第一阶段节点。逐节点遍历并寻找跨段落关系、比喻、条件、共同作用与冲突；生活信息同样重要。不能把两个端点都存在当作因果证据。明确关系标explicit，推断标inferred并保留可能性。允许补充或拆分节点，但保持原信息及来源，不能无故删除。输出{addNodes:[],replaceNodes:[],removeNodeIds:[],edges:[],issues:[]}，replaceNodes使用原ID，拆分使用新ID，删除仅限已完整迁移的信息。edges为全部初始连接。不要制造自环或为孤立节点强行连边。'+stageProtocol,
'你是独立审查者。对照完整编号原文与第二阶段网络逐段检查，优先补回实际遗漏、细节、示例心声、程度偏移和错误因果。检查自环、粒度、无效连接、原文冲突及事实推断混淆；不能把可同时成立的事实判为矛盾。只输出必要修改，不重写完整网络。输出{addNodes:[],replaceNodes:[],removeNodeIds:[],addEdges:[],replaceEdges:[],removeEdgeIds:[],rules:可选完整规则数组,issues:最终疑点数组,base:可选修正身份}。保留原有正确数据，不强求每个节点相连。'+stageProtocol
];
function mergePersonaStage(prev,patch,stage,source){
 if(!patch||typeof patch!=='object'||Array.isArray(patch))throw Error('阶段输出不是JSON对象');
 if(stage===0){const g=expandPersona({...patch,edges:[]});validatePersona(g,source);return g}
 const g=JSON.parse(JSON.stringify(prev));
 function merge(items,adds,replaces,removes,type){
  if(!Array.isArray(adds)||!Array.isArray(replaces)||!Array.isArray(removes))throw Error(type+'修改数组缺失');
  const map=new Map(items.map(x=>[x.id,x]));
  for(const id of removes){if(!map.has(id))throw Error('未知删除ID '+id);map.delete(id)}
  for(const x of replaces){if(!map.has(x.id))throw Error('未知替换ID '+x.id);map.set(x.id,x)}
  for(const x of adds){if(map.has(x.id))throw Error('新增ID重复 '+x.id);map.set(x.id,x)}
  return [...map.values()];
 }
 const nodes=x=>expandPersona({nodes:x}).nodes,edges=x=>expandPersona({edges:x}).edges;
 g.nodes=merge(g.nodes,nodes(patch.addNodes??[]),nodes(patch.replaceNodes??[]),patch.removeNodeIds??[],'节点');
 if(stage===1){if(!Array.isArray(patch.edges))throw Error('缺少关联数组');g.edges=edges(patch.edges);g.issues=[...g.issues,...(patch.issues??[])]}
 else{g.edges=merge(g.edges,edges(patch.addEdges??[]),edges(patch.replaceEdges??[]),patch.removeEdgeIds??[],'连接');if(patch.rules!==undefined)g.rules=expandPersona({rules:patch.rules}).rules;if(patch.base!==undefined)g.base=patch.base;if(patch.issues!==undefined)g.issues=patch.issues}
 validatePersona(g,source);return g;
}

function personaLength(source){return Array.from(source.replace(/\s/gu,'')).length}
function personaTarget(source,density){return density>0?Math.ceil(personaLength(source)/density):0}
function setPersonaDensity(value){if(building)return;const n=Number(value);if(!Number.isInteger(n)||(n!==0&&(n<25||n>100)))return;card().personaDensity=n;save();renderApp()}
function stagePromptFor(i,d){const target=d.nodeTarget||0;return stagePrompts[i]+(i===0&&target>0?'\n本次实验的建议最低节点数量为 '+target+' 个，根据原文非空白字符数计算。请充分拆解独立信息，尽量达到或超过此下限，不设上限。不得为凑数重复同义节点、虚构事实或机械切句；若确实不能达到，在issues说明原因。语言规则不计入节点数量。':'')}

const associationPrompt='你负责构建虚构角色的联想网络，不是人格总结。输入为完整编号原文以及已固定的节点集合。节点不可修改、添加或删除。你的任务是发现一个节点被唤起时，哪些其他节点可能被自然联想到，以及它们之间存在怎样的关系。保留有依据的因果、条件、限制、例外和冲突；同时检查共同场景、共同经历、感官比喻、记忆线索、共同兴趣、个人意义和跨生活领域的联系。不要把共同出现当作因果，也不要虚构经历、动机、行为或确定的心理事实。对于未被原文明示的联想路径，以inferred标记并用可能性措辞。逐一检查全部节点，尤其容易被忽略的日常生活、兴趣、人物、物品和地点；允许没有可靠关联的节点保持孤立。不要仅围绕疾病、情感关系或少数中心节点建立网络。允许多端点关联仅在端点确有共同作用时使用，不要把彼此独立的关系合并为一条。关联数量不设下限或上限，以有意义且有依据为准。只输出JSON对象{edges:[],issues:[]}，edges为全新关联集合，不是旧关联的补丁。'+stageProtocol;
function associationPanel(c){
 const n=c.network,a=c.associationTrial,disabled=building||pending||reviewing?'disabled':'';
 let h='<h2>关联专项实验</h2><p class="meta">固定节点、基础身份和语言规范，仅重新生成关联。一次请求，不自动审查，不覆盖正式网络。</p><div class="actions"><button onclick="runAssociationTrial()" '+(!n||n.source!==c.prompt?'disabled':disabled)+'>重新构建关联</button><button onclick="exportAssociationTrial()" '+(!a?'disabled':'')+'>导出关联实验</button><button onclick="applyAssociationTrial()" '+(!a?.candidate||a.source!==c.prompt||a.baseline.time!==n?.time?'disabled':disabled)+'>采用新关联</button></div>';
 if(!a)return h;
 h+='<p>'+esc(a.status)+' · '+esc(a.model)+' · Temperature '+esc(a.temperature)+' · 输入 '+esc(a.input??'未知')+' / 输出 '+esc(a.output??'未知')+'</p>';
 if(a.error)h+='<p class="error">'+esc(a.error)+'</p>';
 if(a.candidate){const old=validatePersona(a.baseline.graph,a.source),next=validatePersona(a.candidate.graph,a.source);h+='<p>固定 '+a.baseline.graph.nodes.length+' 节点 · 关联 '+a.baseline.graph.edges.length+' → '+a.candidate.graph.edges.length+' · 孤立 '+old.isolated.length+' → '+next.isolated.length+'</p><details><summary>新关联明细</summary>'+a.candidate.graph.edges.map(e=>'<p>'+esc(e.id+' '+e.from.join('+')+' → '+e.to.join('+')+' · '+e.relation+' · '+e.description+' · '+e.evidence)+'</p>').join('')+'</details>'}
 return h;

async function runAssociationTrial(){
 if(building||pending||reviewing)return;
 const c=card(),n=c.network,p={...preset()};
 if(!n||n.source!==c.prompt){alert('请先构建与原文一致的网络');return}
 if(!confirm('固定当前 '+n.graph.nodes.length+' 个节点，使用当前API重新构建关联？仅发起一次请求。若已有专项实验档案，将替换该档案；正式网络不变。'))return;
 const baseline=JSON.parse(JSON.stringify(n)),source=c.prompt,number=experimentNumber(),logs=usageFor(number),before=logs.length;
 const a={source,baseline,model:p.model,temperature:p.temperature,builderVersion:'0.6.7',time:new Date().toISOString(),status:'pending',input:null,output:null};
 c.associationTrial=a;building=true;save();renderApp();let message='';
 try{
  lastPersonaRaw=null;
  const g=baseline.graph;
  const raw=await request(p,[{role:'system',content:associationPrompt},{role:'user',content:JSON.stringify({source:segments(source),base:g.base,nodes:g.nodes,rules:g.rules})}],'persona',number);
  lastPersonaRaw=raw;a.raw=raw;
  const patch=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));
  if(!patch||!Array.isArray(patch.edges)||!Array.isArray(patch.issues))throw Error('关联输出缺少edges或issues数组');
  const graph=JSON.parse(JSON.stringify(g));graph.edges=expandPersona({edges:patch.edges}).edges;graph.issues=patch.issues;
  validatePersona(graph,source);
  if(c.prompt!==source||!db.cards.includes(c)||c.associationTrial!==a||c.network?.time!==baseline.time)throw Error('实验期间角色卡或正式网络已改变');
  a.candidate={...baseline,graph,model:p.model,temperature:p.temperature,builderVersion:'0.6.7',buildMode:'association-only',time:new Date().toISOString()};a.status='ok';message='关联实验完成，正式网络未替换。可先导出比较。';
 }catch(e){a.status='failed';a.error=e.message;if(lastPersonaRaw&&!a.raw)a.raw=lastPersonaRaw;message='关联实验失败：'+e.message+'；原网络保留。'}
 finally{const log=logs[before];if(log){a.input=log.input;a.output=log.output;a.finishReason=log.finishReason??null}if(a.candidate)a.candidate.associationUsage={input:a.input,output:a.output,finishReason:a.finishReason};building=false;save();if(view==='persona'){renderApp();$('status').textContent=message}}
}
function exportAssociationTrial(){const a=card().associationTrial;if(!a)return;const u=URL.createObjectURL(new Blob([JSON.stringify(a,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=u;link.download='be-persona-association.json';link.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function applyAssociationTrial(){if(building||pending||reviewing)return;const c=card(),a=c.associationTrial;if(!a?.candidate||a.source!==c.prompt||c.network?.time!==a.baseline.time)return;if(JSON.stringify([a.candidate.graph.nodes,a.candidate.graph.base,a.candidate.graph.rules])!==JSON.stringify([c.network.graph.nodes,c.network.graph.base,c.network.graph.rules]))return alert('节点不一致，不能作为固定节点关联实验采用');if(!confirm('采用新关联并创建独立实验？原实验不变。'))return;forkExperiment(a.candidate)}

 if(d.stages.length===0&&d.attempts.some(a=>a.stage===0&&a.raw))h+='<div class="actions"><button onclick="recoverPersonaStage()" '+disabled+'>恢复历史输出</button></div>';

 if(d.source!==c.prompt)h+='<p class="error">角色原文已改变，不能续建。</p>';
 for(let i=0;i<3;i++){const a=d.stages[i],logs=d.attempts.filter(x=>x.stage===i);h+='<details><summary>'+stageNames[i]+' · '+(a?'已完成':'未完成')+' · '+logs.length+' 次请求</summary>'+logs.map(x=>'<p class="meta">'+esc(x.status)+' · 输入 '+esc(x.input??'未知')+' · 输出 '+esc(x.output??'未知')+' · '+esc(x.error??'')+'</p>').join('')+(a?'<p>'+a.graph.nodes.length+' 节点 / '+a.graph.edges.length+' 连接</p><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(JSON.stringify(a.graph,null,2))+'</pre>':'')+'</details>'}
 return h;

function recoverPersonaStage(){if(historyFor().length)return alert('请先新建实验再恢复构建');
 if(building||pending||reviewing)return;
 const c=card(),d=c.personaDraft;if(!d||d.source!==c.prompt||d.stages.length!==0)return;
 const candidates=[];
 for(const a of d.attempts){if(a.stage!==0||!a.raw)continue;try{const patch=JSON.parse(a.raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));const graph=mergePersonaStage(null,patch,0,d.source);candidates.push({a,patch,graph})}catch{}}
 if(!candidates.length){alert('没有通过校验的历史输出');return}
 const choices=candidates.map((x,i)=>(i+1)+'：'+x.graph.nodes.length+' 节点 / '+x.graph.rules.length+' 规则').join('\n');
 const choice=prompt('选择要恢复的历史输出（不调用API）：\n'+choices,String(candidates.length));if(choice===null)return;
 const picked=candidates[Number(choice)-1];if(!picked){alert('编号无效');return}
 d.stages.push({stage:0,time:new Date().toISOString(),graph:picked.graph,patch:picked.patch,recoveredFrom:picked.a.time});d.recoveryVersion='0.6.5.1';save();renderApp();$('status').textContent='已恢复第一阶段，无新增API请求。点击继续 / 重试进入第二阶段。';
}

async function runPersonaStages(fresh){if(historyFor().length)return alert('请先新建实验，避免覆盖已有聊天的人格网络');
 if(building||pending||reviewing)return;
 const c=card(),p={...preset()},source=c.prompt;
 if(!source.trim()){alert('请先保存角色卡');return}
 if(fresh){if(!confirm('使用当前API启动三阶段构建？最多三次请求。现有阶段草稿将被替换，正式网络保留。'))return;c.personaDraft={source,model:p.model,temperature:p.temperature,presetId:p.id,builderVersion:'0.6.6',density:personaDensity(c),sourceLength:personaLength(source),nodeTarget:personaTarget(source,personaDensity(c)),stages:[],attempts:[],time:new Date().toISOString()};save()}
 const d=c.personaDraft;if(!d||d.stages.length>=3)return;
 if(d.source!==source||d.model!==p.model||d.temperature!==p.temperature||d.presetId!==p.id){alert('原文或模型预设已变化，请恢复原条件或新建构建');return}
 building=true;renderApp();let message='';
 const number=experimentNumber();
 try{
  for(let i=d.stages.length;i<3;i++){
   if(view==='persona'&&$('status'))$('status').textContent='第 '+(i+1)+' 阶段：'+stageNames[i]+'…';
   const attempt={stage:i,time:new Date().toISOString(),model:p.model,temperature:p.temperature,status:'pending',input:null,output:null};d.attempts.push(attempt);save();
   const logs=usageFor(number),before=logs.length;
   try{
    const input={source:segments(source),previous:i?d.stages[i-1].graph:undefined};
    lastPersonaRaw=null;
    const raw=await request(p,[{role:'system',content:stagePromptFor(i,d)},{role:'user',content:JSON.stringify(input)}],'persona',number);
    lastPersonaRaw=raw;attempt.raw=raw;
    const patch=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));
    const graph=mergePersonaStage(i?d.stages[i-1].graph:null,patch,i,source);
    if(c.prompt!==source||!db.cards.includes(c)||c.personaDraft!==d)throw Error('构建期间角色卡已改变');
    d.stages.push({stage:i,time:new Date().toISOString(),graph,patch});attempt.status='ok';
   }catch(e){attempt.status='failed';attempt.error=e.message;if(lastPersonaRaw&&!attempt.raw)attempt.raw=lastPersonaRaw;throw e}
   finally{const log=logs[before];if(log){attempt.input=log.input;attempt.output=log.output;attempt.finishReason=log.finishReason??null}save()}
  }
  c.network={source,graph:JSON.parse(JSON.stringify(d.stages[2].graph)),model:p.model,temperature:p.temperature,builderVersion:d.builderVersion,buildMode:'staged',density:d.density??0,sourceLength:d.sourceLength??personaLength(source),nodeTarget:d.nodeTarget??0,buildUsage:d.attempts.map(({raw,...a})=>a),time:new Date().toISOString()};save();message='三阶段构建完成，正式网络已更新';
 }catch(e){message='第 '+Math.min(3,d.stages.length+1)+' 阶段失败：'+e.message+'。已完成阶段保留，可续建。'}
 finally{building=false;if(view==='persona'){renderApp();$('status').textContent=message}}
}

function nodePanel(c){const a=c.nodeTrial;return '<hr><h3>节点专项细化</h3><p class="meta">保留原节点编号与关联，新增节点独立编号；替换节点须保留原意及现有关联适用性。候选不自动采用。</p><div class="actions"><button onclick="runNodeTrial()" '+(building||pending||reviewing||!c.network?'disabled':'')+'>审查并细化节点</button><button onclick="exportNodeTrial()">导出节点实验</button><button onclick="applyNodeTrial()" '+(!a?.candidate||building?'disabled':'')+'>采用候选节点</button></div>'+(a?'<p>'+esc(a.status)+' · '+(a.baseline.graph.nodes.length)+' → '+(a.candidate?.graph.nodes.length??'待完成')+' 节点 · 输入 '+(a.input??'未知')+' / 输出 '+(a.output??'未知')+'</p><details><summary>细化依据</summary><pre style="white-space:pre-wrap">'+esc(JSON.stringify(a.patch||a.error||'',null,2))+'</pre></details>':'')}
async function runNodeTrial(){if(building||pending||reviewing)return;const c=card(),p={...preset()},n=c.network;if(!n||n.source!==c.prompt)return alert('请先准备有效网络');if(!confirm('发起一次节点专项审查请求？正式网络不变，已有节点专项候选将被替换。'))return;const baseline=clone(n),number=experimentNumber(),logs=usageFor(number),idx=logs.length,a={baseline,source:c.prompt,model:p.model,temperature:p.temperature,status:'pending',time:new Date().toISOString()};c.nodeTrial=a;building=true;let msg='';try{save();renderApp();lastPersonaRaw=null;const raw=await request(p,[{role:'system',content:'你是虚构人格网络节点审查模块。逐段对照原文与现有节点，查漏、拆分复合信息，保留独立经历、感受、行为、需求、条件、程度、否定及语言示例的区别。例句不是已发生事件。不得虚构事实、机械切句、重复同义节点或强制数量。保留所有原节点ID；拆分时仅在原节点仍保留原关联适用的核心含义时替换，否则保留原节点并补充真正独立的遗漏信息。现有关联、基础人格及语言规则不改。新增节点用未使用的N编号。每项修改必须给出原文来源和理由。仅输出JSON对象 {addNodes:[],replaceNodes:[],reasons:[{id,reason}],issues:[]}。节点为对象，包含id,name,content,sources及必要的attributes,conditions,exceptions。sources为原文S编号数组。'}, {role:'user',content:JSON.stringify({source:segments(c.prompt),graph:baseline.graph})}],'persona',number);a.raw=raw;const patch=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));a.patch=patch;for(const k of ['addNodes','replaceNodes','reasons','issues'])if(!Array.isArray(patch[k]))throw Error('缺少 '+k);const g=clone(baseline.graph),ids=new Set(g.nodes.map(n=>n.id)),seen=new Set();for(const n of [...patch.replaceNodes,...patch.addNodes]){if(seen.has(n.id)||!patch.reasons.some(r=>r.id===n.id&&typeof r.reason==='string'&&r.reason.trim()))throw Error('重复节点或缺少理由 '+n.id);seen.add(n.id)}for(const n of patch.replaceNodes){const i=g.nodes.findIndex(x=>x.id===n.id);if(i<0)throw Error('未知节点 '+n.id);g.nodes[i]=n}for(const n of patch.addNodes){if(ids.has(n.id))throw Error('重复节点 '+n.id);ids.add(n.id);g.nodes.push(n)}g.issues=patch.issues;validatePersona(g,c.prompt);if(c.network?.time!==baseline.time||c.prompt!==a.source||!db.cards.includes(c))throw Error('基准已改变');a.candidate={...baseline,graph:g,time:new Date().toISOString(),builderVersion:'0.6.9',buildMode:'node-refinement',model:p.model,temperature:p.temperature};a.status='ok';msg='节点候选已完成，原网络不变。'}catch(e){a.status='failed';a.error=e.message;a.raw??=lastPersonaRaw;msg='节点实验失败：'+e.message}finally{a.input=logs[idx]?.input??null;a.output=logs[idx]?.output??null;building=false;save();if(view==='persona'){renderApp();$('status').textContent=msg}}}
function exportNodeTrial(){const a=card().nodeTrial;if(!a)return;const u=URL.createObjectURL(new Blob([JSON.stringify(a,null,2)],{type:'application/json'}));const l=document.createElement('a');l.href=u;l.download='be-persona-nodes.json';l.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

function comparisonPanel(c){const parent=db.cards.find(x=>x.id===c.parentCardId);if(!parent)return '';const a=parent.network?.graph,b=c.network?.graph,ps=db.presets.find(p=>p.id===parent.session?.pid),p=preset(),eq=(x,y)=>JSON.stringify(x)===JSON.stringify(y);const checks=[['原文',parent.prompt===c.prompt],['节点',!!a&&!!b&&eq(a.nodes,b.nodes)],['基础人格及语言规则',!!a&&!!b&&eq([a.base,a.rules],[b.base,b.rules])],['关联',!!a&&!!b&&eq(a.edges,b.edges)],['模型及参数',!!ps&&eq([ps.url,ps.model,ps.temperature],[p.url,p.model,p.temperature])],['认知',parent.session?.cogEnabled===db.cogEnabled],['回顾间隔',parent.session?.cogInterval===db.cogInterval],['自主评价',parent.session?.appraisalMode===db.appraisalMode],['时间感知',(parent.timeEnabled!==false)===(c.timeEnabled!==false)&&parent.timeZone===c.timeZone],['面具',eq(db.masks.find(m=>m.id===parent.session?.mid)?.prompt,mask().prompt)&&db.masks.find(m=>m.id===parent.session?.mid)?.public===mask().public],['人格输入模式',personaMode(parent)===personaMode(c)]];return '<details open><summary>与父实验当前配置比较</summary>'+checks.map(([k,v])=>'<p>'+k+'：'+(v?'一致':'不同或未知')+'</p>').join('')+'<p class="meta">仅比较当前配置，不证明历史请求条件一致。</p></details>'}

function setPersonaMode(v){const c=card();if(v!=='original'&&(!c.network||c.network.source!==c.prompt)){alert('请先构建有效网络');renderApp();return}c.personaMode=v;save();renderApp()}
async function buildPersona(){if(building||pending||reviewing)return;if(historyFor().length)return alert('请先新建实验，避免覆盖已有聊天的人格网络');const c=card(),source=c.prompt,p={...preset()};if(!source.trim()){alert('请先保存角色卡');return}if(!confirm('将角色卡全文发送至当前API构建人格网络？可能消耗较多token。'))return;building=true;renderApp();$('status').textContent='构建中…';try{const raw=await request(p,[{role:'system',content:"你是虚构角色的人格网络构建器。输入为完整角色卡的编号片段。目标是构建可独立调用、相互关联的信息网络，不是主题摘要、心理诊断或行为脚本。一次请求内完成全文理解、关联驱动的节点构建、全局审查。只输出最终完整JSON。\n\n一、通读全文，识别角色所拥有的信息及其联系。日常生活、兴趣、地点、物品、人物、感官、经历、价值观、心声和对话示例与心理冲突同等重要，不以情绪强烈程度决定保留优先级。base仅写简短身份锚点。\n\n二、同步构建节点与关联。发现一项信息时，考虑它能否被独立回忆、独立关联、独立变化，或有独立成立条件；若能，则独立成节点。发现跨段落联系时，若现有节点过于宽泛，就拆开相关部分再建立连接，而不是在复合节点的描述中埋藏联系。允许合理的复合属性；不强制数量、分类或每个节点都有边。每个节点保持原意、程度词、频率、否定、条件、例外、主体、时间与不确定性。尤其检查原文的生活细节、独立爱好、不同人物、具体经历、个人赋予事物的意义。示例心声及对话逐个理解其心理与价值信息，标注其为示例而非已发生事件；语言规则单列rules。区分创作者设定、角色已知信息、角色自我解释与客观事实。不要增加诊断、强化情绪或用概括性心理标签替代原文。\n\n三、全局关联与原文审查。重新遍历各节点及原文片段，重点寻找尚未显式建边的跨域联系、比喻、条件、例外、共同作用、价值冲突。explicit表示原文明示的关系，而非仅两个端点都存在；inferred表示有依据但未明示的可能联系，描述中保留不确定性。不得虚构因果、强制联想或未来行为。对照每个有独立意义的原文片段，补齐遗漏、重复、错误引用及悬空边。矛盾保留不同说法，issues指出具体原文编号，不擅自裁决。标题和纯格式行可不生成节点。引用不等于完整覆盖，不虚报覆盖率。\n\n独立示范（不是输入角色资料，不得照搬数据）：\nS1 她喜欢柔软棉布，因为粗糙布料令她不舒服。通常自己缝衣服。\nS2 她喜欢画植物，偶尔会把画送给朋友。\nS3 她不喜欢黏稠的粥，觉得口感像湿布贴在皮肤上。\nS4 她认为为朋友花时间制作东西是一种关心。\nS5 心声示例：朋友说最近很忙。她想等对方有空，而不是催促。\n错误做法：把S1压成“穿衣审美”，把S2、S4压成“艺术与人际”。这样S3的跨感官比喻、S4的赠礼意义就无法独立连接。\n正确做法：拆分粗糙布料不适、棉布偏好、缝衣习惯；分开绘画兴趣、赠画行为、时间与关心的个人意义；把黏稠粥的口感和湿布触感的比喻明确建边。S5可提取示例中的体谅对方时间、克制催促，不声称朋友真的很忙。赠画与时间关心之间的具体动机属于推断，除非原文明说。\n紧凑输出协议：JSON顶层为base,nodes,edges,rules,issues。nodes每项为[id,名称,内容,来源编号数组,可选扩展对象]。edges每项为[id,起点ID数组,终点ID数组,关系,描述,证据类型,来源编号数组,可选扩展对象]。rules每项为[规范文本,来源编号数组]。issues可为字符串或含description及sources的对象。扩展对象仅在确实需要时填写attributes、conditions、exceptions；无特殊内容则省略，程序会补默认字段。条件、例外也可直接保留在内容中，不能为了压缩而遗漏。证据类型使用explicit或inferred。编号保持N1、E1、S1格式。禁止用相同节点作为单一边的两端来替代拆解。原文中的非自愿或伤害性行为仅作非露骨的叙事事实、风险与心理冲突描述，不将角色的自我辩解视为客观无害或同意，不生成实施行为的指令。\n格式示范（只展示部分独立示例数据，不得照搬）：\n{\"base\":\"示例角色\",\"nodes\":[[\"N1\",\"粗糙布料不适\",\"粗糙布料令她不舒服\",[\"S1\"]],[\"N2\",\"柔软棉布偏好\",\"喜欢柔软棉布\",[\"S1\"]],[\"N3\",\"赠画习惯\",\"偶尔把画送给朋友\",[\"S2\"]],[\"N4\",\"时间与关心\",\"认为为朋友花时间制作东西是一种关心\",[\"S4\"]]],\"edges\":[[\"E1\",[\"N1\"],[\"N2\"],\"影响偏好\",\"粗糙布料不适使她喜欢柔软棉布\",\"explicit\",[\"S1\"]],[\"E2\",[\"N3\"],[\"N4\"],\"可能的个人意义\",\"赠画可能体现以制作时间表达关心的观念，具体动机未明确\",\"inferred\",[\"S2\",\"S4\"]]],\"rules\":[],\"issues\":[]}\n只输出完整JSON，保持全部有意义的信息与有依据的关联，不因字段压缩而减少信息。"},{role:'user',content:JSON.stringify(segments(source))}],'persona');lastPersonaRaw=raw;const g=expandPersona(JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,'')));lastPersonaRaw=raw;validatePersona(g,source);if(c.prompt!==source||!db.cards.includes(c))throw Error('构建期间角色卡已改变');c.network={source,graph:g,model:p.model,temperature:p.temperature,builderVersion:'0.6.4',time:new Date().toISOString()};save();if(view==='persona'){renderApp();$('status').textContent='构建完成，请检查来源和待确认事项'}}catch(e){if(view==='persona')$('status').textContent='构建失败（旧网络保留）：'+e.message}finally{building=false;if(view==='persona'){const msg=$('status').textContent;renderApp();$('status').textContent=msg}}}
function exportPersonaRaw(){if(!lastPersonaRaw){alert('本次页面尚无构建原始输出');return}const u=URL.createObjectURL(new Blob([lastPersonaRaw],{type:'text/plain'}));const a=document.createElement('a');a.href=u;a.download='be-persona-raw.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}

async function importPersona(input){if(building||pending||reviewing||historyFor().length)return alert('请在空白实验中导入网络');const c=card();try{const n=JSON.parse(await input.files[0].text());if(n.source!==c.prompt)throw Error('导入网络的原文与当前角色卡不一致');n.graph=expandPersona(n.graph);validatePersona(n.graph,n.source);if(!confirm('替换当前人格网络？'))return;c.network=n;save();renderApp();$('status').textContent='导入成功'}catch(e){$('status').textContent='导入失败：'+e.message}}

function exportChat(){const p=preset();const number=experimentNumber();const data={experimentNumber:number,exportedAt:new Date().toISOString(),preset:Object.fromEntries(Object.entries(p).filter(([k])=>k!=='savedKey')),card:card(),mask:mask(),cognition:archive(),cogEnabled:db.cogEnabled,cogInterval:db.cogInterval,appraisalMode:db.appraisalMode,appraisalEnabled:db.appraisalEnabled,personalEvents:eventsFor(number),usage:usageFor(number),unitPrice:db.unitPrice??null,messages:historyFor()};const u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='be-experiment-'+String(number).padStart(3,'0')+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
async function request(p,messages,kind='chat',number=experimentNumber()){const url=new URL(p.url);if(url.protocol!=='https:'||!p.model)throw Error('请配置 HTTPS API 和模型');const endpoint=url.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'')+'/chat/completions';const headers={'Content-Type':'application/json'};if(keys[p.id])headers.Authorization='Bearer '+keys[p.id];const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),kind==='persona'?240000:90000);const log={kind,time:new Date().toISOString(),model:p.model,status:'pending',input:null,output:null};usageFor(number).push(log);save();try{const res=await fetch(endpoint,{method:'POST',headers,signal:ctrl.signal,body:JSON.stringify({model:p.model,temperature:p.temperature,messages})});if(!res.ok)throw Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));const data=await res.json(),reply=data.choices?.[0]?.message?.content;log.input=data.usage?.prompt_tokens??null;log.output=data.usage?.completion_tokens??null;log.finishReason=data.choices?.[0]?.finish_reason??null;if(kind==='persona'&&log.finishReason==='length'){lastPersonaRaw=typeof reply==='string'?reply:null;throw Error('模型达到输出长度限制，原始输出可导出')}if(typeof reply!=='string')throw Error('API 未返回文本');log.status='ok';return reply}catch(e){log.status='failed';throw e}finally{clearTimeout(timer);save()}}
const schema='仅返回 JSON 对象 {"updates":[{"id":"已有条目ID或空字符串","title":"自主命名","content":"当前主观认知","source":"信息来源","certainty":"自主描述确信程度","status":"当前状态，如相信、怀疑、撤销","reason":"变化原因及主观归因，可未知","evidence":"相关交流或依据"}]}。以角色第一人称叙述，保留有意义的细节。content仅写当前理解，reason重点写变化原因而非重复当前内容，evidence保留原始依据。允许空数组。不得删除历史。合并或拆分时可撤销旧条目并新增条目。';
function applyUpdates(a,raw){const parsed=JSON.parse(raw.trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,''));if(!Array.isArray(parsed.updates))throw Error('认知格式错误');const next=JSON.parse(JSON.stringify(a));for(const u of parsed.updates){if(!u||typeof u.title!=='string'||typeof u.content!=='string')throw Error('认知条目格式错误');const old=u.id?next.entries.find(e=>e.id===u.id):null;if(u.id&&!old)throw Error('未知认知条目');const e={id:old?.id||uid(),title:u.title,content:u.content,source:String(u.source||''),certainty:String(u.certainty||''),status:String(u.status||'相信')};if(old)next.entries[next.entries.indexOf(old)]=e;else next.entries.push(e);next.events.push({id:e.id,time:new Date().toISOString(),before:old||null,after:e,reason:String(u.reason||''),evidence:String(u.evidence||'')})}Object.assign(a,next)}
async function initialize(p,c,m,a){if(a.initialized)return;if(m.prompt.trim()){const raw=await request(p,[{role:'system',content:'你是独立的虚构角色认知初始化模块，不是聊天角色。根据角色设定、关系和开场情境组织初始认知。'+(m.public?'完整公开：将面具全部信息组织进档案。':'部分公开：只筛选有合理依据认为角色已经知道的信息，不泄露其他内容。允许完全为空。')+schema},{role:'user',content:JSON.stringify({character:c.prompt,privateMask:m.prompt})}],'init',db.experimentNumbers[pair(c,m)]||experimentNumber());applyUpdates(a,raw)}a.initialized=true;save()}
async function review(p,c,m,a){const hist=historyFor(c,m),turns=hist.filter(x=>x.role==='assistant').length;if(turns<=a.cursor)return;const number=db.experimentNumbers[pair(c,m)]||experimentNumber(),ev=eventsFor(number),delta=hist.slice(a.cursor*2),unified=delta.some(x=>x.role==='assistant'&&x.appraisalMode==='simple');const extra=unified?' 同一次回顾同时整理个人经历。JSON增加 events 数组，每项包含 title,event,meaning,links,evidence,turn（绝对轮数）。仅记录有持续意义且未重复的经历，meaning以角色第一人称表达，推断须明确不确定性，不编造未表达的心理活动。links仅使用已有认知ID或本次新增条目的标题。允许空数组。':'';
const raw=await request(p,[{role:'system',content:'维护虚构角色对用户的主观认知。仅依据角色设定、已有认知和新增对话。允许未知、误解、欺骗、怀疑、矛盾和错误归因。区分用户自述、观察、推测；角色自己的猜测不是事实。保留旧认知和错误原因，包括本批对话中有依据的中间变化，不总结教训或改变行为策略。不要强制更新。'+schema+extra},{role:'user',content:JSON.stringify({character:c.prompt,entries:a.entries,history:a.events,personalEvents:unified?ev:undefined,startTurn:a.cursor+1,dialogue:delta.map(({role,content})=>({role,content}))})}],'review',number);
const parsed=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));if(unified&&!Array.isArray(parsed.events))throw Error('统一回顾缺少经历数组');const next=JSON.parse(JSON.stringify(a));applyUpdates(next,raw);const additions=[];if(unified)for(const v of parsed.events){if(!v||typeof v.title!=='string'||typeof v.event!=='string'||typeof v.meaning!=='string')throw Error('经历格式错误');if(ev.concat(additions).some(e=>e.title===v.title&&e.event===v.event))continue;additions.push({id:uid(),time:new Date().toISOString(),turn:Math.max(a.cursor+1,Math.min(turns,Math.floor(Number(v.turn)||turns))),title:v.title,event:v.event,meaning:v.meaning,links:Array.isArray(v.links)?v.links.map(k=>next.entries.find(e=>e.id===k||e.title===k)?.id).filter(Boolean):[],evidence:String(v.evidence||''),source:'回顾推断'})}Object.assign(a,next);ev.push(...additions);a.cursor=turns;save()}
async function manualReview(){if(pending||reviewing)return;if(!db.cogEnabled){if(!confirm('认知系统尚未开启。开启并回顾已有聊天？')){$('status').textContent='认知系统已关闭，请在设置中开启。';return}db.cogEnabled=true;save()}reviewing=true;if($('status'))$('status').textContent='正在回顾，请等待 API 返回…';const p={...preset()},c={...card()},m={...mask()},a=archive(pair(c,m));try{await initialize(p,c,m,a);await review(p,c,m,a);if(view==='cognition'){renderApp();$('status').textContent='回顾完成，当前 '+a.entries.length+' 条认知。'}}catch(e){if($('status'))$('status').textContent='回顾失败：'+e.message}finally{reviewing=false;if(view==='cognition'&&$('status')){const message=$('status').textContent;renderApp();$('status').textContent=message}}}

eply.trim())throw Error('评价输出缺少正式回复');reply=obj.reply;const v=obj.event;if(v&&typeof v.title==='string'&&typeof v.event==='string'&&typeof v.meaning==='string'){record={id:uid(),time:new Date().toISOString(),turn:prior.filter(x=>x.role==='assistant').length+1,title:v.title,event:v.event,meaning:v.meaning,links:enabled&&Array.isArray(v.links)?v.links.filter(id=>a.entries.some(e=>e.id===id)):[],evidence:msg,evaluation:typeof obj.evaluation==='string'?obj.evaluation:''}}}if(record)eventsFor(number).push(record);db.history.push({cid:c.id,mid:m.id,role:'user',content:msg,time:sentAt.toISOString()},{cid:c.id,mid:m.id,role:'assistant',content:reply,presetId:p.id,model:p.model,temperature:p.temperature,personaMode:personaMode(c),personaVersion:c.network?.time||null,appraisalMode:mode,appraisalEnabled:mode!=='off',cogEnabled:enabled,time:new Date().toISOString()});save();if(view==='chat')renderApp();if(enabled&&historyFor(c,m).filter(x=>x.role==='assistant').length-a.cursor>=db.cogInterval){try{if($('status'))$('status').textContent='认知回顾中…';await review(p,c,m,a)}catch(e){if($('status'))$('status').textContent='认知回顾失败，记录已保留：'+e.message}}}catch(e){if($('status'))$('status').textContent='请求失败：'+e.message}finally{pending=false;if($('send'))$('send').disabled=false;if(view==='chat'&&$('status')&&/^(生成中|认知回顾中)/.test($('status').textContent))$('status').textContent=''}}
