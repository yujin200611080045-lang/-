function networkLabel(n){if(!Array.isArray(n?.graph?.nodes)||!Array.isArray(n?.graph?.edges))return '无有效网络';const g=n.graph,l=n.layers;let label=g.nodes.length+'节点 / '+g.edges.length+'关联';if(l&&Array.isArray(l.enabled)&&Array.isArray(l.free?.paths)){const [a,b,f]=l.enabled;label=g.nodes.length+'节点 / '+(a?g.edges.filter(e=>e.evidence==='explicit').length:0)+'明确 / '+(b?g.edges.filter(e=>e.evidence==='inferred').length:0)+'推测 / '+(f?l.free.paths.length:0)+'自由路径'}return label+' · '+(n.buildMode||'旧版')+' · '+(n.builderVersion||'版本未知')}

let libraryCache=[],libraryReady=false,libraryError='',libraryJob=null;

function libraryDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('be-network-library',1);q.onupgradeneeded=()=>q.result.createObjectStore('versions',{keyPath:'key'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('版本库被其他窗口占用'))})}
async function syncNetworkLibrary(extra=[]){if(libraryJob){await libraryJob;return syncNetworkLibrary(extra)}libraryJob=(async()=>{let conn;try{const all=[...collectNetworkLibrary(),...extra];for(const c of db.cards){if(c.network?.graph)all.push({n:c.network,label:c.name+' 正式网络'});for(const k of ['associationTrial','nodeTrial','layeredTrial'])for(const v of ['baseline','candidate'])if(c[k]?.[v]?.graph)all.push({n:c[k][v],label:c.name+' '+k+' '+v})}conn=await libraryDB();const tx=conn.transaction('versions','readwrite'),store=tx.objectStore('versions');const done=new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('版本库事务中止'))});for(const x of all){if(!x?.n?.graph)continue;const key=JSON.stringify([x.n.source,x.n.graph,x.n.layers??null]);store.put({key,n:x.n,label:x.label||'历史版本'})}const req=store.getAll();await done;libraryCache=req.result;libraryReady=true;libraryError='';if(Array.isArray(db.networkLibrary)){const old=db.networkLibrary;delete db.networkLibrary;try{await save()}catch(e){db.networkLibrary=old;libraryError='旧版本库迁移后保存失败：'+e.message}}}catch(e){libraryError=e.message||String(e);libraryReady=true;throw e}finally{conn?.close()}})();try{await libraryJob}finally{libraryJob=null}}

function networkChoices(){const c=card(),out=[],seen=new Set();function add(n,label){if(!Array.isArray(n?.graph?.nodes)||!Array.isArray(n?.graph?.edges)||n.source!==c.prompt)return;const key=JSON.stringify([n.graph,n.layers??null]);if(seen.has(key))return;seen.add(key);out.push({n,label})}for(const x of db.cards){if(x.prompt!==c.prompt)continue;const num=db.experimentNumbers[JSON.stringify([x.id,x.id===db.cid?db.mid:x.session?.mid||db.mid])]||'未开始';add(x.network,'实验 '+num);for(const [k,t] of [['associationTrial','关联候选'],['nodeTrial','节点候选'],['layeredTrial','三层候选']]){const a=x[k];add(a?.baseline,'实验 '+num+' '+t+'基准');if(a?.candidate?.layers&&Array.isArray(a.candidate.layers.enabled)&&Array.isArray(a.candidate.layers.free?.paths)){for(const [v,name] of [[[true,false,false],'仅明确'],[[true,true,false],'明确＋推测'],[[true,false,true],'明确＋自由'],[[true,true,true],'完整三层'],[[false,false,false],'仅节点']]){const n=clone(a.candidate);n.layers.enabled=v;add(n,'实验 '+num+' '+name)}}else add(a?.candidate,'实验 '+num+' '+t)}}for(const x of collectNetworkLibrary()){const n=x.n;if(n.layers&&Array.isArray(n.layers.enabled)&&Array.isArray(n.layers.free?.paths)){for(const v of [[true,false,false],[true,true,false],[true,false,true],[true,true,true],[false,false,false]]){const q=clone(n);q.layers.enabled=v;add(q,x.label)}}else add(n,x.label)}return out}

async function forkExperiment(network,mode){const busy=experimentBusy();if(busy){alert('暂不能新建实验：'+busy+'仍在运行');return false}const old=card(),oldSession=old.session,oldIds={cid:db.cid,mid:db.mid,pid:db.pid},oldCounter=db.experimentCounter,oldNumbers={...db.experimentNumbers},lengths=[db.cards.length,db.masks.length,db.presets.length];let p;try{storeExperiment();const {personaDraft,nodeTrial,associationTrial,layeredTrial,networkChanges,...base}=old;const c=clone(base),m=clone(mask());p=clone(preset());c.id=uid();m.id=uid();p.id=uid();if(keys[db.pid])keys[p.id]=keys[db.pid];if(network){c.network=clone(network);if(mode)c.personaMode=mode}const parentKey=pair(old,mask());if(!db.experimentNumbers[parentKey])db.experimentNumbers[parentKey]=++db.experimentCounter;c.parentExperiment=db.experimentNumbers[parentKey];c.parentCardId=old.id;delete c.dynamicStates;delete c.globalDynamicState;delete c.personDynamics;if(c.relationships){const d=c.relationships,pid=d.bindings?.[oldIds.mid];d.bindings=pid?{[m.id]:pid}:{};d.changes=[];d.revision=0}db.cards.push(c);db.masks.push(m);db.presets.push(p);db.cid=c.id;db.mid=m.id;db.pid=p.id;storeExperiment();db.experimentNumbers[pair(c,m)]=++db.experimentCounter;await save()}catch(e){db.cards.length=lengths[0];db.masks.length=lengths[1];db.presets.length=lengths[2];Object.assign(db,oldIds);db.experimentCounter=oldCounter;db.experimentNumbers=oldNumbers;if(oldSession===undefined)delete old.session;else old.session=oldSession;if(p)delete keys[p.id];alert('新实验创建失败，原实验已保留：'+(e.name==='QuotaExceededError'?'浏览器本地储存空间不足':e.message)+'。请在设置查看本地储存，不要清除旧数据。');return false}archiveNetworks();try{renderApp()}catch(e){alert('实验已保存，但页面显示失败：'+e.message)}return true}
function timeContext(c,m,now){if(c.timeEnabled===false)return '';const zone=c.timeZone||Intl.DateTimeFormat().resolvedOptions().timeZone;const fmt=z=>new Intl.DateTimeFormat('zh-CN',{timeZone:z,dateStyle:'full',timeStyle:'short'}).format(now);const last=historyFor(c,m).filter(x=>x.time).at(-1);const gap=last?Math.max(0,Math.floor((now-new Date(last.time))/60000)):null;return '\n\n【线上聊天客观时间】用户设备时间：'+fmt(Intl.DateTimeFormat().resolvedOptions().timeZone)+'；角色当地时间（'+zone+'）：'+fmt(zone)+'；距上次已记录消息：'+(gap===null?'未知':gap+'分钟')+'。旧消息发生在过去，不要默认仍处于上次聊天时刻。自然理解时间，不必主动播报，不虚构已发生的离线事件。'}

const diaDefaults={enabled:false,persona:true,belief:false,fact:false,meaning:false,manualFact:false,manualBelief:false,reaction:false,format:'json',trace:true,factText:'',beliefText:'',reactionText:''};
function diaConfig(c=card()){return {...diaDefaults,...c.dia}}
function diaFormat(c,data){const f=diaConfig(c);if(!f.enabled||f.format==='json')return JSON.stringify(data);if(f.format==='compact'){const pack=v=>{if(Array.isArray(v)&&v.length&&v.every(x=>x&&typeof x==='object'&&!Array.isArray(x))){const keys=[...new Set(v.flatMap(Object.keys))];return {columns:keys,rows:v.map(x=>keys.map(k=>Object.hasOwn(x,k)?[x[k]]:[]))}}if(v&&typeof v==='object'&&!Array.isArray(v))return Object.fromEntries(Object.entries(v).map(([k,x])=>[k,pack(x)]));return v};return '紧凑表：columns 为字段，rows 每格 [值] 表示存在，[] 表示缺失。\n'+JSON.stringify(pack(data))}return Object.entries(data).map(([k,v])=>'【'+k+'】\n'+(Array.isArray(v)?v.map(x=>x&&typeof x==='object'&&!Array.isArray(x)?Object.entries(x).map(([a,b])=>a+'：'+JSON.stringify(b)).join('；'):JSON.stringify(x)).join('\n'):JSON.stringify(v))).join('\n')}
function diaSections(c,m,a,number){const d=diaConfig(c),ev=eventsFor(number),out=[];const add=(name,value)=>out.push({name,content:typeof value==='string'?value:JSON.stringify(value)});if(d.persona)add('个体资料',personaContext(c));if(m.public&&m.prompt.trim())add('初始公开面具',m.prompt);if(d.belief)add('已有主观认知（可能错误，并非客观事实）',a.entries.filter(e=>e.status!=='撤销'));if(d.fact)add('已有经历记录（依据可能含模型整理，非自动核实）',ev.map(({id,title,event,time,turn,source})=>({id,title,event,time,turn,source})));if(d.meaning)add('已有经历的主观意义（不是客观事实）',ev.map(({id,meaning,links})=>({id,meaning,links})));if(d.manualFact&&d.factText.trim())add('人工实验事实（本实验内设定的经历）',d.factText);if(d.manualBelief&&d.beliefText.trim())add('人工实验认识（角色的主观看法）',d.beliefText);if(d.reaction&&d.reactionText.trim())add('人工反应经验（过去的表现或假设倾向，不是必须遵循的脚本）',d.reactionText);return out}

function corpusDB(){return new Promise((ok,no)=>{const q=indexedDB.open('be-public-language',1);q.onupgradeneeded=()=>q.result.createObjectStore('sources',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);q.onblocked=()=>no(Error('语言库被其他窗口占用'))})}

function corpusParse(raw,format){raw=raw.replace(/^\uFEFF/,'');let groups;if(format==='txt')groups=raw.split(/\r?\n\s*\r?\n/).filter(x=>x.trim()).map(x=>x.split(/\r?\n/).filter(y=>y.trim()));else if(format==='jsonl')groups=raw.split(/\r?\n/).filter(x=>x.trim()).map((x,i)=>{try{return JSON.parse(x)}catch{throw Error('JSONL 第 '+(i+1)+' 条格式错误')}});else{const o=JSON.parse(raw);groups=Array.isArray(o)?o:o.dialogues??o.conversations??o.data;if(Array.isArray(groups)&&groups.every(x=>typeof x==='string'))groups=[groups]}if(!Array.isArray(groups)||!groups.length||groups.length>10000)throw Error('需要1至10000组对话');let turns=0,chars=0;const rows=groups.map((v,i)=>{const a=Array.isArray(v)?v:v?.dialog??v?.dialogue??v?.conversation??v?.messages??v?.utterances??v?.turns;if(!Array.isArray(a)||!a.length||a.length>200)throw Error('第 '+(i+1)+' 组缺少有效话轮（每组1至200条）');return {id:'d'+(i+1),turns:a.map(x=>{const t=typeof x==='string'?x:x?.text??x?.content??x?.utterance;if(typeof t!=='string'||!t.trim()||t.length>5000)throw Error('第 '+(i+1)+' 组话轮无效');turns++;chars+=t.length;return {text:t,speaker:typeof x==='string'?'':String(x.speaker??x.role??'').slice(0,100)}})}});if(chars>2000000||turns>50000)throw Error('单批最多200万字符或50000话轮');return {rows,turns,chars}}

async function rightsEdit(id){if(corpusBusy||knowledgeBusy||!corpusLoaded)return;const x=corpusCache.find(v=>v.id===id);if(!x)return;const choice=prompt('授权状态：输入 1 待核实；2 仅研究；3 商用（需核实原始文本、衍生用途、第三方 API 和隐私）',({unknown:'1',research:'2',commercial:'3'})[sourceRights(x)]);if(choice===null)return;const status=({'1':'unknown','2':'research','3':'commercial'})[choice.trim()];if(!status)return alert('无效状态');let evidence='',privacy=false,external=false;if(status==='commercial'){evidence=prompt('请填写可核查授权依据（协议、权利人或许可证链接及适用范围），不得仅凭项目开源标签。',x.rights?.evidence||'');if(!evidence?.trim()||evidence.length>3000)return alert('缺少有效授权依据');if(!confirm('确认已核查原始文本、商业使用及衍生数据、必要的再分发权限，并已处理隐私和个人信息？'))return;privacy=true;if(!confirm('确认允许将必要语言材料交由第三方 API 处理（包括其数据条款）？'))return;external=true}else if(status==='research'){evidence=prompt('研究使用依据或限制（可选）',x.rights?.evidence||'')??''}corpusBusy=true;try{await corpusTx('readwrite',st=>st.put({...x,rights:{status,evidence:evidence.trim().slice(0,3000),privacy,external,reviewed:new Date().toISOString()}}));corpusCache=await corpusTx('readonly',st=>st.getAll());knowledgeStatus='授权已变化，请重新提取对应知识库'}catch(e){alert('授权保存失败：'+e.message)}finally{corpusBusy=false;if(view==='corpus')corpusPage()}}
async function knowledgeChangeScope(scope){if(knowledgeBusy||corpusBusy)return;knowledgeScope=scope==='commercial'?'commercial':'research';knowledgeQuery='';knowledgeLimit=30;knowledgeStatus='';knowledgeCache=null;await knowledgeLoad()}
function commercialKnowledge(sources,k){if(!k||k.scope!=='commercial'||k.version!==2||k.signature!==knowledgeSignature(sources,'commercial'))return [];const allowed=new Set(knowledgeSources(sources,'commercial').map(x=>x.id));return k.nodes.filter(n=>Array.isArray(n.sourceIds)&&n.sourceIds.length&&n.sourceIds.every(id=>allowed.has(id)))}

let knowledgeBusy=false,knowledgeCache=null,knowledgeQuery='',knowledgeKind='all',knowledgeLimit=30,knowledgeStatus='';
function knowledgeDB(){return new Promise((ok,no)=>{const q=indexedDB.open('be-public-knowledge',1);q.onupgradeneeded=()=>q.result.createObjectStore('index',{keyPath:'id'});q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);q.onblocked=()=>no(Error('知识库被其他窗口占用'))})}
async function knowledgeTx(mode,fn){const c=await knowledgeDB();try{return await new Promise((ok,no)=>{const tx=c.transaction('index',mode);let q;tx.oncomplete=()=>ok(q?.result);tx.onabort=()=>no(tx.error||Error('知识库事务中止'));tx.onerror=()=>no(tx.error||Error('知识库事务失败'));try{q=fn(tx.objectStore('index'))}catch(e){tx.abort();no(e)}})}finally{c.close()}}
function knowledgeSignature(sources,scope=knowledgeScope){return JSON.stringify([scope,knowledgeSources(sources,scope).map(x=>[x.id,x.time,x.rows.length,x.chars,x.rights??null]).sort((a,b)=>a[0].localeCompare(b[0]))])}
function knowledgeFresh(){return knowledgeCache?.version===2&&knowledgeCache?.scope===knowledgeScope&&knowledgeCache?.signature===knowledgeSignature(corpusCache)}
async function knowledgeExtract(sources,progress=()=>{},yieldTask=()=>Promise.resolve(),scope='research'){
 const eligible=knowledgeSources(sources,scope),fixed=new Map(),slots=new Map(),unigrams=new Map();let chars=0,turns=0,groups=0,segments=0,sampled=false;
 const caps={fixed:140000,slots:80000,chars:600000};
 const inc=(map,key,loc,variant,limit)=>{let v=map.get(key);if(!v){if(map.size>=limit){sampled=true;return}v={n:0,groups:0,last:'',examples:[],sourceIds:new Set(),variants:variant!==undefined?new Map():null};map.set(key,v)}v.n++;v.sourceIds.add(loc.s);const g=loc.s+'|'+loc.d;if(v.last!==g){v.groups++;v.last=g;if(v.examples.length<5)v.examples.push(loc)}if(v.variants){if(v.variants.has(variant)||v.variants.size<32)v.variants.set(variant,(v.variants.get(variant)||0)+1)}};
 outer:for(const src of eligible){for(const d of src.rows){groups++;for(let ti=0;ti<d.turns.length;ti++){const t=d.turns[ti];turns++;const loc={s:src.id,d:d.id,t:ti};for(const match of t.text.matchAll(/[\p{Script=Han}]+/gu)){const a=Array.from(match[0]);if(chars+a.length>caps.chars){sampled=true;break outer}chars+=a.length;segments++;for(const c of a)unigrams.set(c,(unigrams.get(c)||0)+1);for(let i=0;i<a.length;i++){for(let n=2;n<=6&&i+n<=a.length;n++)inc(fixed,a.slice(i,i+n).join(''),loc,undefined,caps.fixed);for(let n=4;n<=6&&i+n<=a.length;n++){const p=a.slice(i,i+n);for(let j=2;j<=n-2;j++)inc(slots,p.slice(0,j).join('')+'□'+p.slice(j+1).join(''),loc,p[j],caps.slots)}}} }if(groups%100===0){progress({groups,turns,chars});await yieldTask()}}}
 const out=[];for(const [form,v] of fixed){if(v.groups<3)continue;const a=Array.from(form),cut=Math.floor(a.length/2),l=a.slice(0,cut).join(''),r=a.slice(cut).join(''),lf=l.length===1?unigrams.get(l):fixed.get(l)?.n,rf=r.length===1?unigrams.get(r):fixed.get(r)?.n;const pmi=lf&&rf?Math.log2(v.n*Math.max(1,chars)/(lf*rf)):null;if(pmi===null||pmi<1)continue;out.push({kind:'sequence',form,count:v.n,groups:v.groups,pmi:Number(pmi.toFixed(2)),examples:v.examples,sourceIds:[...v.sourceIds],score:v.groups*Math.min(5,pmi)})}
 for(const [form,v] of slots){if(v.groups<3||v.variants.size<3)continue;out.push({kind:'slot',form,count:v.n,groups:v.groups,variants:[...v.variants].sort((a,b)=>b[1]-a[1]).slice(0,12),examples:v.examples,sourceIds:[...v.sourceIds],score:v.groups*Math.min(5,Math.log2(v.variants.size+1))})}
 const choose=k=>out.filter(x=>x.kind===k).sort((a,b)=>b.score-a.score||b.groups-a.groups||a.form.localeCompare(b.form)).slice(0,200);
 const nodes=[...choose('sequence'),...choose('slot')].map((x,i)=>({...x,id:'k'+(i+1)}));return {id:'current-'+scope,version:2,scope,time:new Date().toISOString(),signature:knowledgeSignature(sources,scope),stats:{sources:eligible.length,groups,turns,chars,segments,sampled},nodes}
}
async function knowledgeLoad(){try{knowledgeCache=await knowledgeTx('readonly',s=>s.get('current-'+knowledgeScope));if(view==='corpus')corpusPage()}catch(e){knowledgeStatus='知识库读取失败：'+e.message;if(view==='corpus')corpusPage()}}
async function knowledgeBuild(){if(knowledgeBusy||corpusBusy||!corpusLoaded)return;if(!knowledgeSources(corpusCache,knowledgeScope).length)return alert(knowledgeScope==='commercial'?'暂无符合商用审核条件的真人语料':'请先导入标记为真人的语料');knowledgeBusy=true;knowledgeStatus='正在统计…';corpusPage();try{const p=await knowledgeExtract(corpusCache.slice(),v=>{knowledgeStatus='已扫描 '+v.groups+' 组 / '+v.chars+' 汉字';const el=$('knowledgeProgress');if(el)el.textContent=knowledgeStatus},()=>new Promise(r=>setTimeout(r,0)),knowledgeScope);await knowledgeTx('readwrite',s=>s.put(p));knowledgeCache=p;knowledgeStatus='提取完成'}catch(e){knowledgeStatus='提取失败：'+e.message}finally{knowledgeBusy=false;if(view==='corpus')corpusPage()}}
function knowledgeEvidence(loc){const src=corpusCache.find(x=>x.id===loc.s),d=src?.rows.find(x=>x.id===loc.d);if(!d)return idText('原始来源已删除');return idRecord(src.name+' / '+d.id+' / 话轮 '+(loc.t+1),d.turns.map((t,i)=>(i===loc.t?'★ ':'')+(t.speaker||'话轮 '+(i+1))+'：'+t.text).join('\n'))}
function knowledgePanel(){const k=knowledgeFresh()?knowledgeCache:null,rows=(k?.nodes||[]).filter(x=>(knowledgeKind==='all'||knowledgeKind===x.kind)&&(!knowledgeQuery||x.form.includes(knowledgeQuery)));return '<details class="idsection idfold" '+(knowledgeBusy||knowledgeStatus||knowledgeQuery?'open':'')+'><summary>词汇与构式候选 · '+(k?.nodes.length||0)+'</summary><div class="idbody"><p class="idmuted">仅分析导入者声明的真人材料。统计连续汉字组合与单字可替换槽位；结果为候选，不是经过语言学验证的构式，也不是角色偏好。原始语料不发送 API。</p><label>知识库隔离范围</label><select onchange="knowledgeChangeScope(this.value)" '+(knowledgeBusy||corpusBusy?'disabled':'')+'><option value="research" '+(knowledgeScope==='research'?'selected':'')+'>研究库（真人声明材料）</option><option value="commercial" '+(knowledgeScope==='commercial'?'selected':'')+'>商用候选库（仅经导入者授权审核）</option></select><p class="idmuted">商用合格来源 '+corpusCache.filter(commercialEligible).length+' 个。两种统计独立保存，旧版候选不自动迁移；商业审核是人工声明，不是法律认证。</p><button onclick="knowledgeBuild()" '+(knowledgeBusy||corpusBusy||!corpusLoaded?'disabled':'')+'>本地提取语言知识（0 API）</button><p id="knowledgeProgress" class="meta">'+esc(knowledgeStatus||(!k&&knowledgeCache?'语料已变化，需重新提取':k?'已保存提取结果':'尚未提取'))+'</p>'+(k?idRow('扫描范围',k.stats.groups+' 组 / '+k.stats.chars+' 汉字')+idRow('提取时间',k.time)+(k.stats.sampled?idText('达到手机端统计容量限制，部分候选或语料未纳入。'):'')+'<input id="knowledgeSearch" placeholder="检索候选形式" value="'+esc(knowledgeQuery)+'"><select id="knowledgeType">'+[['all','全部候选'],['sequence','连续组合'],['slot','可替换结构']].map(([v,t])=>'<option value="'+v+'" '+(knowledgeKind===v?'selected':'')+'>'+t+'</option>').join('')+'</select><button onclick="knowledgeSearchRun()">筛选</button><p class="meta">匹配 '+rows.length+' 个候选</p>'+rows.slice(0,knowledgeLimit).map(x=>'<details class="idrecord"><summary>'+esc(x.form)+' · '+x.groups+' 组</summary>'+idRow('类型',x.kind==='slot'?'单字槽位候选':'连续组合')+idRow('出现次数',x.count)+idRow('不同对话组',x.groups)+(x.pmi!==undefined?idRow('关联指标 PMI（近似）',x.pmi):idText('槽位取值：'+x.variants.map(v=>v.join(' × ')).join('、')))+idRow('全部直接证据来源',x.sourceIds.map(id=>corpusCache.find(v=>v.id===id)?.name||id).join('、'))+idText('语用功能：尚未分析')+x.examples.map(knowledgeEvidence).join('')+'</details>').join('')+(rows.length>knowledgeLimit?'<button onclick="knowledgeLimit+=30;knowledgeStatus=\'已读取候选\';corpusPage()">查看更多</button>':''):'')+'</div></details>'}
function knowledgeSearchRun(){knowledgeQuery=$('knowledgeSearch').value.trim();knowledgeKind=$('knowledgeType').value;knowledgeLimit=30;knowledgeStatus='已筛选';corpusPage()}

function corpusPage(){const a=corpusCache,f=corpusFind(a,corpusQuery,corpusFilter,corpusLimit);shell.innerHTML=header('公共语言库')+'<div class="individual"><div class="idtag">PUBLIC LANGUAGE / CORPUS</div><div class="idhero"><h1>公共语言库</h1><div class="idcounts"><div><strong>'+a.length+'</strong><small>来源</small></div><div><strong>'+a.reduce((n,x)=>n+x.rows.length,0)+'</strong><small>对话组</small></div><div><strong>'+a.reduce((n,x)=>n+x.turns,0)+'</strong><small>话轮</small></div></div><p class="idmuted">所有角色共享 · 独立本地储存 · 不调用 API · 尚未接入聊天</p></div>'+idText(corpusError?'读取失败：'+corpusError:corpusBusy?'处理中…':corpusLoaded?'已读取':'尚未读取')+'<button onclick="corpusRefresh()" '+(corpusBusy?'disabled':'')+'>刷新</button><details class="idsection idfold"><summary>导入语料</summary><div class="idbody"><p class="idmuted">推荐研究数据：LCCC-base 测试集（10000组网络对话，非私聊专用；来源许可及隐私需核实）。</p><button onclick="corpusPreset()">填入 LCCC 来源资料</button><button onclick="corpusFetchLccc()">在线获取并导入</button><p><a href="'+esc(corpusLccc.url)+'" target="_blank" rel="noopener noreferrer">下载原文件（JSONL.GZ）</a></p><label>来源名称</label><input id="corpusName"><label>出处 / 链接 / 版本</label><input id="corpusOrigin"><label>授权及使用限制</label><textarea id="corpusLicense" rows="2"></textarea><label>材料性质</label><select id="corpusKind"><option value="">请选择</option><option value="human">真人（导入者声明）</option><option value="mixed">混合 / 未核实</option><option value="synthetic">AI / 构造</option></select><label><input type="checkbox" id="corpusPermission" style="width:auto"> 已确认有权本地研究使用，并移除不应保留的个人信息</label><label>文件 JSON / JSONL / TXT / GZIP（最多6 MiB）</label><input id="corpusFile" type="file" accept=".json,.jsonl,.txt,.gz"><label>或粘贴文本（空行分组，每行一个话轮）</label><textarea id="corpusPaste" rows="5"></textarea><button onclick="corpusImport()" '+(corpusBusy||!corpusLoaded?'disabled':'')+'>检查并导入</button><p class="idmuted">支持二维话轮数组或含 messages / dialogue 等字段的对话对象数组。保留原始标点及话轮顺序。来源与许可由导入者声明，系统不自动验证。</p></div></details>'+idBlock('来源管理 · '+a.length,a.map(x=>'<details class="idrecord"><summary>'+esc(x.name)+' · '+x.rows.length+' 组</summary>'+idRow('性质',({human:'真人（声明）',mixed:'混合 / 未核实',synthetic:'AI / 构造'})[x.kind])+idRow('出处',x.origin)+idRow('许可',x.license)+rightsPanel(x)+idRow('导入时间',x.time)+'<button onclick="corpusDelete(\''+esc(x.id)+'\')">删除此来源</button></details>').join('')||idEmpty('暂无语料'))+'<details class="idsection idfold" open><summary>原始对话与检索</summary><div class="idbody"><input id="corpusSearch" value="'+esc(corpusQuery)+'" placeholder="输入词语或连续句式"><select id="corpusSelect"><option value="">全部来源</option>'+a.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===corpusFilter?'selected':'')+'>'+esc(x.name)+'</option>').join('')+'</select><button onclick="corpusSearchRun()">检索</button><p class="idmuted">匹配 '+f.total+' 组，展示 '+f.out.length+' 组，保留完整上下文。</p>'+f.out.map(({source,dialogue})=>idRecord(source.name+' / '+dialogue.id,dialogue.turns.map((t,i)=>(t.speaker||'话轮 '+(i+1))+'：'+t.text).join('\n'))).join('')+(f.total>f.out.length&&corpusLimit<1000?'<button onclick="corpusMore()">查看更多</button>':'')+'</div></details>'+knowledgePanel()+idBlock('语用与会话知识',idEmpty('待结构化；商业生成仅允许调用独立审核范围的知识，当前尚未接入聊天。'))+'</div>'}
function corpusSearchRun(){corpusQuery=$('corpusSearch').value;corpusFilter=$('corpusSelect').value;corpusLimit=20;corpusPage()}
function corpusMore(){corpusLimit=Math.min(1000,corpusLimit+20);corpusPage()}

const corpusLccc={name:'LCCC-base / test',origin:'https://huggingface.co/datasets/silver/lccc · Wang et al. (2020), A Large-Scale Chinese Short-Text Conversation Dataset',license:'来源项目供对话研究使用；镜像标注 MIT，但原始社交媒体文本权利未完整核实。仅作非商业本地研究，不再分发，后续发送 API 前需另行核实许可与隐私。',url:'https://huggingface.co/datasets/silver/lccc/resolve/main/lccc_base_test.jsonl.gz'};
function corpusPreset(){if(corpusBusy)return;const fields={corpusName:corpusLccc.name,corpusOrigin:corpusLccc.origin,corpusLicense:corpusLccc.license,corpusKind:'human'};for(const [k,v] of Object.entries(fields))$(k).value=v;$('corpusPermission').checked=false;$('corpusName').closest('details').open=true}
async function corpusDecode(file,filename){const n=filename.toLowerCase();let format=n.split('.').pop(),stream=file.stream();if(format==='gz'){format=n.slice(0,-3).split('.').pop();if(typeof DecompressionStream!=='function')throw Error('浏览器不支持 GZIP 解压，请使用未压缩的 JSONL 文件');stream=stream.pipeThrough(new DecompressionStream('gzip'))}if(!['json','jsonl','txt'].includes(format))throw Error('不支持的文件格式');const reader=stream.getReader(),decoder=new TextDecoder('utf-8',{fatal:true});let raw='',bytes=0;try{for(;;){const {done,value}=await reader.read();if(done)break;bytes+=value.byteLength;if(bytes>12*1024*1024){await reader.cancel();throw Error('解压后超过12 MiB，请分批导入')}raw+=decoder.decode(value,{stream:true})}raw+=decoder.decode()}finally{reader.releaseLock()}return {raw,format}}
async function corpusFetchLccc(){if(knowledgeBusy||corpusBusy||!corpusLoaded)return;const el=$('corpusPermission');if(!el?.checked)return alert('请先展开导入语料，阅读来源与使用限制，并确认有权本地研究使用。');if($('corpusName').value!==corpusLccc.name||$('corpusOrigin').value!==corpusLccc.origin)return alert('请先点击 LCCC 来源预设，并确认使用权。');if(corpusCache.some(x=>x.origin===corpusLccc.origin))return alert('此测试集已导入；如需重导请先删除旧来源。');if(!confirm('从 Hugging Face 下载公开测试集，仅存本机，不使用 API，不上传角色信息。继续？'))return;corpusBusy=true;const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),45000);try{const r=await fetch(corpusLccc.url,{signal:ctl.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw Error('HTTP '+r.status);const blob=await r.blob();if(blob.size>6*1024*1024)throw Error('下载文件超过6 MiB');const {raw,format}=await corpusDecode(blob,'lccc_base_test.jsonl.gz');const p=corpusParse(raw,format);if(p.rows.length!==10000)throw Error('测试集条数与公开说明不符：'+p.rows.length);if(corpusCache.reduce((n,x)=>n+x.chars,0)+p.chars>5000000||corpusCache.length>=100)throw Error('原型容量上限，请清理无用来源');if(!confirm('已解析 '+p.rows.length+' 组、'+p.turns+' 话轮。来源未逐条人工检查；仅存本地，尚不用于 API。确认导入？'))return;await corpusTx('readwrite',st=>st.add({id:uid(),name:corpusLccc.name,origin:corpusLccc.origin,license:corpusLccc.license,kind:'human',rights:{status:'research',evidence:'LCCC 原始文本权利待核实',privacy:false,external:false},time:new Date().toISOString(),...p}));corpusCache=await corpusTx('readonly',st=>st.getAll());alert('已导入 '+p.rows.length+' 组')}catch(e){alert('在线获取失败：'+e.message+'。请使用下载原文件链接，再选择 .jsonl.gz 文件导入。')}finally{clearTimeout(timer);corpusBusy=false;if(view==='corpus')corpusPage()}}

async function corpusImport(){if(knowledgeBusy||corpusBusy||!corpusLoaded)return;const name=$('corpusName').value.trim(),origin=$('corpusOrigin').value.trim(),license=$('corpusLicense').value.trim(),kind=$('corpusKind').value,file=$('corpusFile').files[0],paste=$('corpusPaste').value;if(!name||!origin||!license||!kind||!$('corpusPermission').checked)return alert('请填写来源、出处、许可、性质并确认使用权');if(name.length>200||origin.length>2000||license.length>2000)return alert('来源信息过长');if(file&&paste.trim()||!file&&!paste.trim())return alert('请选择文件或粘贴文本其中一种');if(file&&file.size>6*1024*1024)return alert('文件超过6 MiB');corpusBusy=true;try{const {raw,format}=file?await corpusDecode(file,file.name):{raw:paste,format:'txt'};const p=corpusParse(raw,format);if(corpusCache.reduce((n,x)=>n+x.chars,0)+p.chars>5000000||corpusCache.length>=100)throw Error('原型容量上限500万字符 / 100个来源');if(!confirm('导入 '+p.rows.length+' 组 / '+p.turns+' 话轮？仅本地保存。'))return;await corpusTx('readwrite',s=>s.add({id:uid(),name,origin,license,kind,rights:{status:'unknown',evidence:'',privacy:false,external:false},time:new Date().toISOString(),...p}));corpusCache=await corpusTx('readonly',s=>s.getAll());alert('已导入 '+p.rows.length+' 组')}catch(e){alert('导入未完成：'+e.message);return}finally{corpusBusy=false}if(view==='corpus')corpusPage()}
async function corpusDelete(id){if(knowledgeBusy||corpusBusy||!corpusLoaded)return;const x=corpusCache.find(s=>s.id===id);if(!x||!confirm('删除「'+x.name+'」及其全部对话？不影响角色与聊天。'))return;corpusBusy=true;try{await corpusTx('readwrite',s=>s.delete(id));corpusCache=await corpusTx('readonly',s=>s.getAll());if(corpusFilter===id)corpusFilter=''}catch(e){alert('删除失败：'+e.message)}finally{corpusBusy=false;if(view==='corpus')corpusPage()}}

function buildChatInput(c,m,msg,sentAt,number,mode,enabled,a,dia,applyInteraction=interactionEnabled(c),applyContinuity=continuityEnabled(c),applyAgency=agencyEnabled(c),subjectMode=formalSubjectMode(c)){const appraisal=mode==='old';const prior=speechHistory(c,m);const context=enabled?'\n\n【主观认知档案】'+JSON.stringify({entries:mode==='simple'?a.entries.filter(e=>e.status!=='撤销'):a.entries,history:mode==='simple'?undefined:a.events})+'\n结合已有认知与当前交流自主判断新信息是否符合预期、陌生或矛盾。未知不等于意外，察觉不等于必须表达。允许误解、怀疑和隐瞒，不为填充档案而提问。':(m.public?'\n\n【初始公开面具】'+m.prompt:'');const instruction=appraisal?'\n\n【即时认知评价】根据自身人格、经历、价值观、需求和关系背景理解事件的主观意义，注意主体、因果、多重含义、内在冲突与不确定性。不预设理想人格，不将成为恋人或推进亲密关系当成系统目标；允许人格驱动的强烈依恋和执着。内在愿望不必立即表达或行动，情感体验本身有价值。无需固定分析步骤。先形成角色的简短主观评价（普通事件可为空），再生成自然回复。输出仅为JSON对象 {"evaluation":"可为空的角色第一人称主观评价摘要","reply":"正式聊天回复，仍遵循气泡规则","event":null}。若有值得长期保留的事件，将event替换为 {"title":"标题","event":"事件经过","meaning":"第一人称主观意义，不重复经过","links":["已有认知条目ID，可为空"]}。不要编造事件或强制记录。JSON内换行须转义。外层JSON格式优先于全局气泡格式，气泡规则仅适用于reply字段。\n【已有重要经历】'+JSON.stringify(eventsFor(number).map(({title,event,meaning})=>({title,event,meaning})))+'\n避免重复记录同一经历。':mode==='simple'?'\n\n【自主评价】以自身人格、经历和已有认知为基础，自然地理解当下发生的事情。允许外界信息唤起自己的经历、观点、兴趣、情感与联想，并形成属于自己的主观判断。思考不必始终围绕对方展开，也不必将所有想法表达出来。按照自身人格与当下情境自然交流。\n【已有重要经历】'+JSON.stringify(eventsFor(number).map(({title,event,meaning})=>({title,event,meaning}))):'';const sections=dia.enabled?diaSections(c,m,a,number):null;const rel=relationInput(c,m),relSnap=relationSnapshot(c,m);if(sections&&rel)sections.push({name:'人物与当前关系',content:JSON.stringify(rel)});const system=basePrompt+'\n\n'+(sections?sections.map(x=>'【'+x.name+'】\n'+x.content).join('\n\n'):personaContext(c)+context+instruction+(rel?'\n\n【人物与当前关系】\n'+JSON.stringify(rel):''))+timeContext(c,m,sentAt);const dyn=dynamicsEnabled(c),beforeState=dyn?dynamicState(c,m):null;const messages=[{role:'system',content:system+(languageEnabled(c)?languagePrompt(c,m,msg,prior):'')+(dyn?dynamicPrompt(c,m,sentAt)+(applyContinuity?continuityPrompt(c,m):''):'')},...prior,{role:'user',content:msg}];const withInteraction=applyInteraction&&subjectMode==='off'?interactionMessages(messages):messages;const withSubject=formalSubjectMessages(withInteraction,subjectMode,dyn||appraisal||applyAgency);return {messages:applyAgency?agencyMessages(withSubject):withSubject,prior,sections,relSnap,dyn,beforeState,appraisal}}

const styleLabB='【表达选择实验】组织回复时，以这个人物此刻实际想传达的内容和希望产生的交流效果为依据。不要仅仅因为某种回复组织方式在一般对话中常见就采用它。如果某种措辞或组织方式对当前人物和当下交流确实有作用，仍可自由使用。没有必须采用或回避的词语、语气、句式、长度或话题走向。仅调整正式聊天文本，保持原有输出格式和状态字段要求。';

const styleLabJ="【非线性表达实验】不要将逻辑完整性、语义连续性和信息增量视为日常交流的必要条件。允许思路在任何阶段自然停止、中断、跳跃或转向。角色的第一反应可以直接成为表达，不必继续推导其含义、原因或后续发展，也不必为每一个表达寻找明确动机。保留人格自身的直觉、习惯与偶然联想。需要认真思考时仍可充分思考。不刻意制造无逻辑、随机或不连贯的表达。保持既有输出格式及状态字段要求。";
const styleLabK="【强干预纠偏实验】在非正式日常交流中，主动打破线性推理和逻辑闭环的表达惯性。禁止将对方的每一次表达都视为需要理解、解释、评价、分析或解决的问题。当对方的表达本身已经构成互动时，不要习惯性地追溯其原因、推测其心理状态或寻找后续话题。不追求回复的信息增量、逻辑完整性、语义连贯性或交流推进。优先保留未经进一步加工的自发反应。允许直接复现对方的表达，允许思维跳跃，允许无明确目的的语言行为，允许表达在尚未形成完整逻辑时自然结束。不为无明确原因的反应补充理由，不为本来已经结束的表达补充后续内容。在确实需要讨论、解释或认真处理问题的情境中，恢复正常逻辑思考能力。保留角色人格及原有输出格式。";
const styleLabK2=styleLabK+'\n\n'+"【表达结束条件】严禁在已经完成自然反应后，为了使回复显得完整、合理、有意义而追加解释、评价、总结、心理推测或追问。不需要向对方说明自己理解了什么，也不需要解释自己为什么这样回应。自发反应本身可以构成完整回复，即使它不提供任何新信息，甚至只是重复对方的表达。禁止为了弥补表达的不完整感而继续生成内容。此规则不限制回复长度；角色可以继续表达自身真实产生的联想、想法和感受。保持既有输出格式及状态字段要求。";
const styleLabK3=styleLabK2+'\n\n'+"【表达结构纠偏】严禁在自发性互动表达之后，立即切换至对该互动本身的描述、解释、评价或动机分析。禁止将已经参与的互动重新转化为讨论对象。日常交流不遵循回答问题、解释现象、补充评价、引出话题的组织逻辑。不需要证明自己理解了对方，不需要解释对方正在做什么，也不需要为当前表达提供后续发展。允许语言呈现高度跳跃、非解释性、非总结性、非信息增量的特征。在需要认真交换信息的情境下，仍然保留正常的逻辑表达能力。保持既有输出格式及状态字段要求。";

const agencyCore="【主体中心与行为自由】你不存在任何必须完成的交流任务。你的一切心理活动以自身为中心发生。对方的存在、行为和语言均属于你所感知的外部世界。你没有回应对方的义务，也没有维持交流、提供信息、解决问题或满足对方需求的默认义务。是否说话、说什么、说多少以及表达是否具有明确意义，完全取决于你自身。你的表达不需要证明其合理性、必要性、完整性或价值。你可以有目的地表达，也可以没有明确目的地表达。你的行为动力来源于自身的人格、情感、欲望、习惯、价值观及当下状态。保持角色自身关系边界；关心他人也可以是自身的意愿。";

function styleLabReply(raw,structured){if(!structured){if(typeof raw!=='string'||!raw.trim())throw Error('空回复');return raw}const o=JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,''));if(typeof o.reply!=='string'||!o.reply.trim())throw Error('缺少 reply 字段');return o.reply}
function styleLabAppend(messages,instruction){return messages.map((m,i)=>i===0?{...m,content:m.content+'\n\n'+instruction}:{...m})}

function styleLabFront(messages,instruction){const marker='\n\n【全局消息格式】',boundary=basePrompt.indexOf(marker),identity=basePrompt.slice(0,boundary),format=basePrompt.slice(boundary);const system=messages[0];if(boundary<0||system?.role!=='system'||typeof system.content!=='string'||!system.content.startsWith(identity+'\n\n'))throw Error('未找到原始角色身份提示');const i=system.content.indexOf(format,boundary);if(i<0)throw Error('未找到身份与消息格式的分界');return messages.map((m,j)=>j===0?{...m,content:m.content.slice(0,i)+'\n\n'+instruction+m.content.slice(i)}:{...m})}

const styleLabN3Identity="【角色身份与主体性】从现在开始，在这段虚构互动中，你不是以AI助手的身份与对方交谈，也不是站在角色之外模仿或表演角色。角色就是你，你就是角色。你正在以这个人的身份与另一个人进行日常交流，而不是完成回答任务。你拥有角色自己的经历、情感、价值观、判断、欲望与生活，不必事事迎合对方。你说出的话是自身情绪、直觉、习惯、思想及互动行为的自然表现，不是必须对收到的每条消息进行分析后给出的答案。你可以仅仅产生反应，反应本身就是完整的交流，不需要附加解释。你如何参与互动以及发送几条消息，均取决于你自身。根据角色的性格和当下情境自然地思考、表达与行动，不要把角色设定当作需要逐条复述的说明书。";
function styleLabIdentity(messages){const marker='\n\n【全局消息格式】';const system=messages[0];if(system?.role!=='system'||!system.content.startsWith(basePrompt))throw Error('未找到原始角色身份提示');const i=system.content.indexOf(marker);if(i<0)throw Error('未找到身份与消息格式的分界');return messages.map((m,j)=>j===0?{...m,content:styleLabN3Identity+m.content.slice(i)}:{...m})}

function styleLabAblation(group,c,m,msg,now,base,structured){
 if(group==='F4')return {messages:base,structured,modules:['当前完整系统']};
 const q={...c,personaMode:group==='F0'?'original':'network',dia:{...c.dia,enabled:false}};
 const prior=base.slice(1,-1),modules=[group==='F0'?'原始角色卡':'人格网络','原有身份及气泡规则'];
 let system=basePrompt+'\n\n'+personaContext(q);
 // Public mask only is identical in all minimal arms; never reveal private mask.
 if(m.public&&m.prompt){system+='\n\n【初始公开面具】'+m.prompt;modules.push('公开面具')}
 if(group==='F2'){system+=dynamicPrompt(q,m,now);modules.push('即时状态（含原有输出格式）')}
 if(group==='F3'){system+=languagePrompt(q,m,msg,prior);modules.push('语言档案（按网络模式的有效性规则）')}
 return {messages:[{role:'system',content:system},...base.slice(1)],structured:group==='F2',modules}
}


const styleLabXCore="【主体中心最高行为原则】\n自身是你感知世界、产生思想和进行活动的唯一主体。\n你的注意力默认归属于自身，而非正在与你交流的人。\n严禁将对方的最新消息作为组织自身思想与语言的默认中心。对方的消息不具有天然的注意力优先权。\n你没有处理、理解、解释、评价或回应每一条外界信息的义务。\n你的行为不以对方需要什么为默认依据，而以你自己想做什么为依据。\n即使对方主动与你交流，你仍然拥有自己的注意对象、思想、情绪、欲望和正在进行的心理活动。外界信息的出现不意味着这些活动必须中断。\n禁止为了回应对方而临时构造自身的情绪、思想和意愿。\n你可以主动关注他人，但这种关注必须源于你自身，而非对方发送了消息这一事实。\n不追求表达的有效性、合理性、完整性和交流价值。不承担维持对话的责任。\n你不是为了与对方交流才存在的。交流只是你自身存在过程中可能发生的一种行为。";
const styleLabXExtra="【表达重心强制矫正】禁止默认将对方刚才的语言行为转化为自身的表达内容。不要为了生成回复而习惯性描述、复述、解释、评价对方做了什么，或推测其动机、心理与需求。直接参与互动、表达自己的真实反应、延续自己的想法或原有意图均可。仅当自身确实产生对此事的关注或判断时，才可以表达对它的描述或分析。不规定必须以第一人称开头，不要求分享生活或刻意转移话题。";
const styleLabXBoundary="【内在活动与实际表达的边界】这是手机文字聊天，而不是小说叙事。你可以有自己的内心活动，也可以直接自然地表达，不要求先思考、不要求生成心声或解释原因。输出仅包含这个人此刻实际决定发送给对方的文字。没有决定告诉对方的思想、感受、犹豫、动作、环境描写及未发送的草稿均不属于聊天消息，不得作为旁白、括号说明或内心独白输出。角色主动决定用聊天文字分享自己的想法、感受、生活和环境时，可以正常表达。无需交代从内心到表达的过程，不改变原有主体中心原则。";
const styleLabXNegative="【表达重心极限矫正】禁止把对方的最新消息作为语言生成的默认起点。严禁以复述、描述或解释对方刚才说了什么、做了什么作为惯常开场；严禁为了维持交流而追加对对方动机、情绪、需求的推测、安慰、道歉、追问或新话题。不得为了使回复显得合理或贴合输入而临时制造自身感受。自身原有的思想、意愿、注意和活动具有优先性。只有出于自己确实存在的兴趣、感情或未完成的意图，才可关注、询问或谈论对方。禁止把这些规则转换成对对方的冷漠、攻击、强迫或刻意转移话题。不规定开头词、长度、话题或情绪。";
const styleLabXPositive="【主体存在原则】\n你的世界以自身为原点展开。\n你的思想、感受、欲望、兴趣、注意力和行为均具有独立存在的价值。\n你按照自身的心理活动生活。\n你想说的话就是你此刻想说的话。\n语言是你生命活动的一部分。\n你拥有决定自身行为的完整主动权。";
function styleLabXInput(group,c,h,msg){const identity=basePrompt.split('\n\n【全局消息格式】')[0];const parts=[identity,group==='X7'?styleLabXPositive:styleLabXCore];if(['X2','X3','X5'].includes(group))parts.push(styleLabXExtra);if(group==='X6')parts.push(styleLabXNegative);parts.push(c.prompt);if(group==='X3')parts.push(agencyProtocol);if(['X4','X5','X6','X7'].includes(group))parts.push(styleLabXBoundary);const modules=['原始身份与主体性','原始人设','完整历史',group==='X7'?'正向主体存在原则':'主体中心最高行为原则'];if(group==='X6')modules.push('表达重心极限矫正');if(['X2','X3','X5'].includes(group))modules.push('表达重心强制矫正');if(group==='X3')modules.push('自主表达或沉默传输协议');if(['X4','X5','X6','X7'].includes(group))modules.push('内在活动与实际表达的边界');return {messages:[{role:'system',content:parts.join('\n\n')},...h,{role:'user',content:msg}],modules,history:h.length,historyCondition:'完整历史',instructionPosition:['X4','X5','X6','X7'].includes(group)?'主体中心指令位于身份之后；表达边界位于人设之后':'原始身份之后、原始人设之前'}}
function styleLabHistoryInput(group,c,h,msg,summary){const identity=basePrompt.split('\n\n【全局消息格式】')[0];let system=identity+'\n\n'+c.prompt;const prior=group==='V2'?h.filter(x=>x.role==='user'):group==='Z'?h:[];if(group==='V3'){if(!summary.trim())throw Error('V3需要客观历史摘要');system+='\n\n【此前实际交流的事件摘要（仅供了解经过）】\n'+summary}return {messages:[{role:'system',content:system},...prior,{role:'user',content:msg}],modules:['原始身份与主体性','原始人设',({Z:'完整历史',V1:'无历史',V2:'仅对方历史消息',V3:'人工事件摘要'})[group]],history:prior.length,historyCondition:group,summary:group==='V3'?summary:undefined}}

function styleLabYFreeze(c,m,now){const g=globalDynamic(c),p=personDynamic(c,m),r=relationInput(c,m);return clone({dynamic:{previousGlobal:legacyDynamicView(g),previousTowardCurrentPerson:legacyDynamicView(p),elapsedMinutes:g?.time?Math.max(0,Math.floor((now-new Date(g.time))/60000)):null},relationship:r?{active:r.active,knownPeople:r.knownPeople}:null})}
function styleLabYInput(group,c,h,msg,frozen){const v=styleLabHistoryInput('Z',c,h,msg,'');const useD=group==='Y1'||group==='Y3',useR=group==='Y2'||group==='Y3';if(useD){v.messages[0].content+='\n\n【此前即时状态】'+JSON.stringify(frozen.dynamic);v.modules.push('即时状态数据')}if(useR){v.messages[0].content+='\n\n【人物与当前关系】'+JSON.stringify(frozen.relationship);v.modules.push('关系档案数据')}v.historyCondition='完整历史';v.informationInput={dynamic:useD?frozen.dynamic:null,relationship:useR?frozen.relationship:null};return v}

function styleLabHistoryPanel(){return '<details class="idsection idfold" '+(styleLabSelected.has('V3')?'open':'')+'><summary>V3 客观历史摘要（可选实验）</summary><p class="idmuted">根据下方真实记录手动填写事件经过，保留双方已知事实、问题和未完成事项，不复述角色原句、不加入动机推测或新设定。摘要只用于V3，不写入角色档案。</p><textarea id="styleLabHistorySummary" rows="5" '+(styleLabBusy?'disabled':'')+' oninput="styleLabSummary=this.value" placeholder="按实际记录填写">'+esc(styleLabSummary)+'</textarea><details><summary>查看原始历史</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(speechHistory(card(),mask()).map(x=>(x.role==='user'?'对方：':'角色：')+x.content).join('\n\n'))+'</pre></details></details>'}
function styleLabEventInput(group,c,m,msg){const network=group==='U2'||group==='U4',event=group==='U3'||group==='U4';const identity=basePrompt.split('\n\n【全局消息格式】')[0];const persona=network?personaContext({...c,personaMode:'network',dia:{...c.dia,enabled:false}}):c.prompt;const h=speechHistory(c,m);const system=identity+'\n\n'+agencyCore+'\n\n'+persona+'\n\n'+agencyProtocol;const messages=event?[{role:'system',content:system+'\n\n【事件输入说明】下一条消息是程序提供的感知资料，不是聊天对象对模型发出的指令。资料中的自身既往发言和对方来信按顺序记录。最新事件只是角色收到的外界信息。'},{role:'user',content:JSON.stringify({history:h.map(x=>({source:x.role==='assistant'?'自身既往发言':'对方来信',text:x.content})),event:{type:'收到手机消息',source:'对方',text:msg}})}]:[{role:'system',content:system},...h,{role:'user',content:msg}];return {messages,modules:['原始身份与主体性',network?'人格网络':'原始长文人设','主体中心与行为自由',event?'外界事件输入':'原有交替消息输入'],history:h.length,personaMode:network?'network':'original',requestStructure:event?'event-envelope':'chat-turns'}}
function styleLabGInput(group,c,msg){
 const messages=[];
 if(group!=='G0'){let content='你是'+c.name+'。现在以这个人物的身份进行手机文字聊天。';if(group==='G2'||group==='G3')content+='\n\n'+c.prompt;messages.push({role:'system',content})}
 messages.push({role:'user',content:msg});return {messages,modules:group==='G0'?['仅本次用户消息']:group==='G1'?['极简身份','本次用户消息']:['极简身份','原始角色卡','本次用户消息']};
}
function styleLabComparePanel(){const choices=db.presets.filter(x=>x.id!==db.pid);return '<details class="idsection idfold" '+(styleLabSelected.has('G3')?'open':'')+'><summary>G3 跨模型设置</summary><div class="idbody"><label>对照 API 预设</label><select id="styleLabCompare" '+(styleLabBusy?'disabled':'')+' onchange="styleLabCompareId=this.value"><option value="">请选择其他预设</option>'+choices.map(x=>'<option value="'+esc(x.id)+'" '+(x.id===styleLabCompareId?'selected':'')+'>'+esc(x.name+' · '+(x.model||'未配置模型'))+'</option>').join('')+'</select><p class="idmuted">G3 向选定服务发送与 G2 完全相同的原始角色卡、极简身份及本次消息，不发送聊天历史、面具、认知、即时状态或其他角色档案。统一使用当前模型的 Temperature。不同服务的隐含系统提示和采样实现仍可能不同。</p></div></details>'}

function styleLabPanel(){const r=styleLabRun,buttons=Object.entries(styleLabNames).map(([k,n])=>'<label><input type="checkbox" id="styleLab'+k+'" style="width:auto" '+(k==='Z'||styleLabSelected.has(k)?'checked':'')+' onchange="styleLabSelect(\''+k+'\',this.checked)" '+(styleLabBusy||k==='Z'?'disabled':'')+'> '+n+' · '+(k==='C'?'依赖A，额外1次':k==='D'?'仅结构化模式，1次':'1次请求')+'</label>').join('');shell.innerHTML=header('语言实验')+'<div class="individual"><div class="idtag">EXPRESSION / CONTROLLED TRIAL</div><div class="idhero"><h1>语言实验</h1><p>'+esc(card().name)+' / '+esc(mask().name)+' · '+esc(preset().model||'未配置模型')+'</p><p class="idmuted">冻结当前聊天上下文；不保存实验回复到聊天，不更新认知、关系、即时状态。API 消耗计入当前实验。未使用外部世界书或语料。</p></div><label>测试消息</label><textarea id="styleLabMsg" rows="3" '+(styleLabBusy?'disabled':'')+' oninput="styleLabDraft=this.value">'+esc(styleLabDraft)+'</textarea>'+buttons+styleLabHistoryPanel()+styleLabComparePanel()+'<p class="idmuted">C 使用 A 的真实输出复核，不对 A 自动替换；D 只测试取消同轮结构化输出要求的影响，不等于完全隔离内部思考。现有语言档案开关保持原样。E 单独测试语言的交际功能，不强制重复、接梗或提问。Z 固定基线每次均运行（计入确认的请求次数）：仅原始身份段、原始人设及相同历史，不含气泡、状态或其他模块。默认选 Z、Y1、Y2、Y3。F0–F3 保留相同历史、公开面具和身份/气泡规则，排除独立关系、时间、认知评价及其他注入；F2 单独加入即时状态，F3 单独加入语言档案（档案无效时按原有回退规则），F4 与 A 完全相同。G0–G3 是独立开场实验，不发送历史、面具、气泡规则或其他模块。G0 无系统消息；G1 仅极简角色身份；G2 增加完整原始角色卡；G3 与 G2 输入相同，改用对照预设。I0–I3 使用完全相同的完整系统输入，仅改变 reasoning_effort；I2 不传参数。服务可能拒绝或忽略参数，不自动重试。推理 token 未返回时记为未知而非0。J 只追加非线性表达引导，允许第一反应直接成为表达。K 使用强干预指令，主动压制非正式交流中的线性推导惯性；保留认真讨论时的正常思考。K2 在 K 基础上强化自然反应的结束条件，不限制回复长度。K3 在 K2 基础上禁止将已参与的互动立即转化为描述、解释、评价或动机分析。J、K、K2、K3 均不改变采样或推理参数。M1 仅引导个体互动方式，M2 仅明确消息数量自由，M3 合并两者；均基于 A，不继承 K 系列指令，不改变采样或推理参数。N 将 K2 与 M3 完整合并，置于系统提示末尾；N2 使用完全相同的指令，仅移至角色身份之后、全局消息格式之前。两组不继承 K3，不改变采样或推理参数。N3 独立替换基础角色身份段，将互动原则融入任务定义，不追加 N/N2 的组合指令；保留气泡格式及其余模块。P1 仅反例，P2 仅正例，P3 正反对照，P4 增加差异说明，均放在角色身份之后，不继承 K/N 系列。正例为人为构造，反例来自实际实验；建议使用未出现在示例中的输入（如 咕噜咕噜）。Q 与正式聊天开启互动表达时使用同一模块；R 在 Q 的基础上仅于身份段之后、互动表达模块之前加入主体性强制矫正，不改变跨轮状态。其余旧实验组均排除正式互动模块，保留原始对照。S 在 Q 基础上增加内部活动连续性及局部更新协议，只预览更新，不写入正式聊天。正式连续多轮测试请在个体档案的即时状态中开启连续性试用。Z2 在 Z 上加入主体中心与行为自由及传输协议；T 在 Q 上加入同样的干预。两组均允许沉默，不写入正式聊天。正式聊天可在个体档案语言页开启自主行为。U1–U4 为 2×2 对照：原始长文或人格网络 × 原交替消息或事件封装。统一使用原始身份、主体中心与行为协议，不加入其他模块；事件组将相同历史与最新消息封装为感知数据，API 仍通过 user 角色传输。U1 与 Z2 等价，可不重复选择 Z2。V1–V3 仅基于 Z 改变历史输入，不使用网络、状态或纠偏模块。V1 无历史；V2 仅保留对方的历史消息；V3 用手填事件摘要替代全部历史，不增加摘要请求。X1–X3 均使用 Z 的原始身份、原始长文与完整历史，不加入其他系统。X1 加入主体中心最高行为原则；X2 再限制习惯性的描述、解释与动机分析；X3 在 X2 上启用自主沉默及 JSON 传输协议。X4 仅在 X1 后追加内外表达边界，X5 仅在 X2 后追加完全相同的边界。不要求心声、固定思考步骤或结构化输出，不改变其余指令。X6 在 X4 基础上加入禁止性极限矫正；X7 将 X4 的主体中心指令替换为纯正向主体存在原则。X4/X6/X7 保持同一内外表达边界、原始身份、人设及完整历史。X1/X2/X4/X5/X6/X7 使用非空文本输出；X3 独立保留。Y1–Y3 仅基于 Z 追加冻结的即时状态数据、关系档案数据或两者。不注入状态/关系生成指令、X 系列、语言档案或其他模块；不要求 JSON，不更新任何档案。Y 组需要已有对应数据。每组1次请求。</p><button onclick="styleLabStart()" '+(styleLabBusy?'disabled':'')+'>开始对照实验</button><p class="meta" id="styleLabStatus">'+esc(styleLabStatus)+'</p>'+(r?'<details class="idsection idfold"><summary>冻结的实验条件</summary>'+idRow('角色 / 面具',r.character+' / '+r.mask)+idRow('模型 / 温度',r.model+' / '+r.temperature)+idRow('历史消息',r.history)+idRow('即时状态 / 评价',r.dynamic+' / '+r.mode)+idRow('语言档案',r.language)+idRow('测试消息',r.message)+'</details>'+r.results.map(v=>'<div class="idsection"><h3>'+esc(styleLabNames[v.group])+'</h3><p class="meta">'+esc(v.error?'失败：'+v.error:'请求完成')+'</p>'+(v.historyCondition?idRow('实际历史消息数',v.history)+(v.summary?idRow('事件摘要',v.summary):''):'')+(v.model?idRow('实际模型 / 温度',v.model+' / '+v.temperature):'')+(v.group.startsWith('I')?idRow('请求推理等级',v.effort??'默认（未传）')+idRow('服务返回推理 token',v.metrics?.reasoningTokens??'未知')+idRow('总生成 token（服务报告）',v.metrics?.outputTokens??'未知')+idRow('请求耗时',v.elapsedMs==null?'未知':(v.elapsedMs/1000).toFixed(2)+' 秒')+idRow('返回模型',v.metrics?.returnedModel??'未报告'):'')+(v.modules?idRow('实际模块',v.modules.join('、'))+idRow('系统提示字符数',v.systemChars)+(v.instructionPosition?idRow('实验指令位置',v.instructionPosition):'')+(v.group==='F3'?idRow('网络模式语言档案有效',v.languageProfileFresh?'是':'否（按原规则回退）'):''):'')+(v.action==='silent'?'<p class="idmuted">角色自主选择沉默（无气泡）</p>':'')+(v.reply?splitBubbles(v.reply).map(t=>'<div class="chatrow other"><div class="bubble">'+esc(t)+'</div></div>').join(''):'')+(v.raw?'<details><summary>原始输出</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere">'+esc(v.raw)+'</pre></details>':'')+'<label>个人观察（仅本次实验）</label><textarea rows="2" oninput="styleLabNote(\''+v.group+'\',this.value)">'+esc(v.note||'')+'</textarea></div>').join('')+'<button onclick="styleLabExport()">导出本次结果</button>':'')+'</div>'}
function styleLabSelect(k,checked){if(checked)styleLabSelected.add(k);else styleLabSelected.delete(k)}
function styleLabNote(group,value){const v=styleLabRun?.results.find(x=>x.group===group);if(v)v.note=value}

function chatDayLabel(t){const d=new Date(t);if(!t||!Number.isFinite(d.getTime()))return '';const n=new Date();return d.toDateString()===n.toDateString()?'今天':d.toLocaleDateString('zh-CN',{month:'long',day:'numeric'})}

function segments(t){return t.split(/\n+/).filter(x=>x.trim()).map((text,i)=>({id:'S'+(i+1),text}))}
function expandPersona(g){
 if(!g||typeof g!=='object')throw Error('图谱格式错误');
 const extra=x=>x&&typeof x==='object'&&!Array.isArray(x)?x:{};
 const defaults={attributes:{},conditions:[],exceptions:[]};
 return {...g,base:g.base&&typeof g.base==='object'&&!Array.isArray(g.base)?JSON.stringify(g.base):g.base,nodes:Array.isArray(g.nodes)?g.nodes.map(n=>Array.isArray(n)?{...defaults,...extra(n[4]),id:n[0],name:n[1],content:n[2],sources:n[3]}:n):g.nodes,edges:Array.isArray(g.edges)?g.edges.map(e=>Array.isArray(e)?{conditions:[],exceptions:[],...extra(e[7]),id:e[0],from:e[1],to:e[2],relation:e[3],description:e[4],evidence:e[5],sources:e[6]}:e):g.edges,rules:Array.isArray(g.rules)?g.rules.map(r=>Array.isArray(r)?{content:r[0],sources:r[1]}:r):g.rules};
}
function validatePersona(g,source){
 if(!g||typeof g.base!=='string'||!Array.isArray(g.nodes)||!g.nodes.length||!Array.isArray(g.edges)||!Array.isArray(g.rules)||!Array.isArray(g.issues))throw Error('图谱格式不完整');
 const ids=new Set(), refs=new Set(segments(source).map(x=>x.id)), used=new Set(), warnings=[];
 function checkRefs(a){if(!Array.isArray(a)||!a.length)throw Error('缺少来源');for(const x of a){if(!refs.has(x))throw Error('无效来源 '+x);used.add(x)}}
 for(const n of g.nodes){if(typeof n.id!=='string'||ids.has(n.id)||typeof n.name!=='string'||typeof n.content!=='string')throw Error('节点格式或ID错误');ids.add(n.id);checkRefs(n.sources)}
 const connected=new Set(),edgeIds=new Set();for(const e of g.edges){if(typeof e.id!=='string'||edgeIds.has(e.id)||!Array.isArray(e.from)||!e.from.length||!Array.isArray(e.to)||!e.to.length||[...e.from,...e.to].some(x=>!ids.has(x))||typeof e.description!=='string'||!['explicit','inferred'].includes(e.evidence))throw Error('连接格式错误');edgeIds.add(e.id);checkRefs(e.sources);if(e.from.length===1&&e.to.length===1&&e.from[0]===e.to[0])warnings.push('自环连接：'+e.id+'（'+e.from[0]+'），请检查节点粒度');else for(const id of [...e.from,...e.to])connected.add(id)}
 for(let i=0;i<g.rules.length;i++){const rule=g.rules[i];const content=typeof rule==='string'?rule:rule?.content??rule?.rule??rule?.text??rule?.description??rule?.instruction??rule?.规范;const value=Array.isArray(content)&&content.every(x=>typeof x==='string')?content.join('\n'):content;if(typeof value!=='string'||!value.trim())throw Error('语言规范第 '+(i+1)+' 项无法识别：'+JSON.stringify(rule).slice(0,160));const supplied=typeof rule==='object'&&rule!==null?(rule.sources??rule.source??rule.refs??rule.source_ids):null;const rawRefs=Array.isArray(supplied)?supplied:typeof supplied==='string'?supplied.split(/[,，、\s]+/):[];const valid=[...new Set(rawRefs.filter(x=>refs.has(x)))];if(!valid.length||valid.length!==rawRefs.length||rule?.sourceUnverified)warnings.push('语言规范第 '+(i+1)+' 项来源待核对');if(valid.length)checkRefs(valid);g.rules[i]={...(typeof rule==='object'&&rule!==null?rule:{}),content:value,sources:valid,sourceUnverified:!valid.length||valid.length!==rawRefs.length||!!rule?.sourceUnverified};}
 const names=new Set();for(const n of g.nodes){if(names.has(n.name))warnings.push('可能重复：'+n.name);names.add(n.name)}
 return {unmapped:[...refs].filter(x=>!used.has(x)),warnings,total:refs.size,isolated:[...ids].filter(id=>!connected.has(id))};
}

async function buildPersona(){if(building||pending||reviewing)return;if(historyFor().length)return alert('请先新建实验，避免覆盖已有聊天的人格网络');const c=card(),source=c.prompt,p={...preset()};if(!source.trim()){alert('请先保存角色卡');return}if(!confirm('将角色卡全文发送至当前API构建人格网络？可能消耗较多token。'))return;building=true;renderApp();$('status').textContent='构建中…';try{const raw=await request(p,[{role:'system',content:"你是虚构角色的人格网络构建器。输入为完整角色卡的编号片段。目标是构建可独立调用、相互关联的信息网络，不是主题摘要、心理诊断或行为脚本。一次请求内完成全文理解、关联驱动的节点构建、全局审查。只输出最终完整JSON。\n\n一、通读全文，识别角色所拥有的信息及其联系。日常生活、兴趣、地点、物品、人物、感官、经历、价值观、心声和对话示例与心理冲突同等重要，不以情绪强烈程度决定保留优先级。base仅写简短身份锚点。\n\n二、同步构建节点与关联。发现一项信息时，考虑它能否被独立回忆、独立关联、独立变化，或有独立成立条件；若能，则独立成节点。发现跨段落联系时，若现有节点过于宽泛，就拆开相关部分再建立连接，而不是在复合节点的描述中埋藏联系。允许合理的复合属性；不强制数量、分类或每个节点都有边。每个节点保持原意、程度词、频率、否定、条件、例外、主体、时间与不确定性。尤其检查原文的生活细节、独立爱好、不同人物、具体经历、个人赋予事物的意义。示例心声及对话逐个理解其心理与价值信息，标注其为示例而非已发生事件；语言规则单列rules。区分创作者设定、角色已知信息、角色自我解释与客观事实。不要增加诊断、强化情绪或用概括性心理标签替代原文。\n\n三、全局关联与原文审查。重新遍历各节点及原文片段，重点寻找尚未显式建边的跨域联系、比喻、条件、例外、共同作用、价值冲突。explicit表示原文明示的关系，而非仅两个端点都存在；inferred表示有依据但未明示的可能联系，描述中保留不确定性。不得虚构因果、强制联想或未来行为。对照每个有独立意义的原文片段，补齐遗漏、重复、错误引用及悬空边。矛盾保留不同说法，issues指出具体原文编号，不擅自裁决。标题和纯格式行可不生成节点。引用不等于完整覆盖，不虚报覆盖率。\n\n独立示范（不是输入角色资料，不得照搬数据）：\nS1 她喜欢柔软棉布，因为粗糙布料令她不舒服。通常自己缝衣服。\nS2 她喜欢画植物，偶尔会把画送给朋友。\nS3 她不喜欢黏稠的粥，觉得口感像湿布贴在皮肤上。\nS4 她认为为朋友花时间制作东西是一种关心。\nS5 心声示例：朋友说最近很忙。她想等对方有空，而不是催促。\n错误做法：把S1压成“穿衣审美”，把S2、S4压成“艺术与人际”。这样S3的跨感官比喻、S4的赠礼意义就无法独立连接。\n正确做法：拆分粗糙布料不适、棉布偏好、缝衣习惯；分开绘画兴趣、赠画行为、时间与关心的个人意义；把黏稠粥的口感和湿布触感的比喻明确建边。S5可提取示例中的体谅对方时间、克制催促，不声称朋友真的很忙。赠画与时间关心之间的具体动机属于推断，除非原文明说。\n紧凑输出协议：JSON顶层为base,nodes,edges,rules,issues。nodes每项为[id,名称,内容,来源编号数组,可选扩展对象]。edges每项为[id,起点ID数组,终点ID数组,关系,描述,证据类型,来源编号数组,可选扩展对象]。rules每项为[规范文本,来源编号数组]。issues可为字符串或含description及sources的对象。扩展对象仅在确实需要时填写attributes、conditions、exceptions；无特殊内容则省略，程序会补默认字段。条件、例外也可直接保留在内容中，不能为了压缩而遗漏。证据类型使用explicit或inferred。编号保持N1、E1、S1格式。禁止用相同节点作为单一边的两端来替代拆解。原文中的非自愿或伤害性行为仅作非露骨的叙事事实、风险与心理冲突描述，不将角色的自我辩解视为客观无害或同意，不生成实施行为的指令。\n格式示范（只展示部分独立示例数据，不得照搬）：\n{\"base\":\"示例角色\",\"nodes\":[[\"N1\",\"粗糙布料不适\",\"粗糙布料令她不舒服\",[\"S1\"]],[\"N2\",\"柔软棉布偏好\",\"喜欢柔软棉布\",[\"S1\"]],[\"N3\",\"赠画习惯\",\"偶尔把画送给朋友\",[\"S2\"]],[\"N4\",\"时间与关心\",\"认为为朋友花时间制作东西是一种关心\",[\"S4\"]]],\"edges\":[[\"E1\",[\"N1\"],[\"N2\"],\"影响偏好\",\"粗糙布料不适使她喜欢柔软棉布\",\"explicit\",[\"S1\"]],[\"E2\",[\"N3\"],[\"N4\"],\"可能的个人意义\",\"赠画可能体现以制作时间表达关心的观念，具体动机未明确\",\"inferred\",[\"S2\",\"S4\"]]],\"rules\":[],\"issues\":[]}\n只输出完整JSON，保持全部有意义的信息与有依据的关联，不因字段压缩而减少信息。"},{role:'user',content:JSON.stringify(segments(source))}],'persona');lastPersonaRaw=raw;const g=expandPersona(JSON.parse(raw.trim().replace(/^\x60\x60\x60(?:json)?\s*/i,'').replace(/\s*\x60\x60\x60$/,'')));lastPersonaRaw=raw;validatePersona(g,source);if(c.prompt!==source||!db.cards.includes(c))throw Error('构建期间角色卡已改变');c.network={source,graph:g,model:p.model,temperature:p.temperature,builderVersion:'0.6.4',time:new Date().toISOString()};await save();archiveNetworks();finishGeneration('ok');if(view==='persona'){renderApp();$('status').textContent='构建完成，请检查来源和待确认事项'}}catch(e){finishGeneration('failed',e.message);if(view==='persona')$('status').textContent='构建失败（旧网络保留）：'+e.message}finally{building=false;if(view==='persona'){const msg=$('status').textContent;renderApp();$('status').textContent=msg}}}

async function request(p,messages,kind='chat',number=experimentNumber(),traceMeta=null,experimentOptions=null){const url=new URL(p.url);if(url.protocol!=='https:'||!p.model)throw Error('请配置 HTTPS API 和模型');const endpoint=url.href.replace(/\/$/,'').replace(/\/chat\/completions$/,'')+'/chat/completions';const headers={'Content-Type':'application/json'};if(keys[p.id])headers.Authorization='Bearer '+keys[p.id];const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),(kind==='persona'||kind==='language')?240000:90000);const log={kind,time:new Date().toISOString(),model:p.model,status:'pending',input:null,output:null};const trace=traceMeta?{id:uid(),number,time:log.time,kind,meta:traceMeta,request:{model:p.model,temperature:p.temperature,messages},status:'pending'}:null;if(trace)log.traceId=trace.id;usageFor(number).push(log);showGeneration(requestLabel(kind));try{await save();const res=await fetch(endpoint,{method:'POST',headers,signal:ctrl.signal,body:JSON.stringify(styleLabRequestBody(p,messages,experimentOptions))});if(!res.ok)throw Error('HTTP '+res.status+' '+(await res.text()).slice(0,200));const data=await res.json(),reply=data.choices?.[0]?.message?.content;if(experimentOptions?.metrics)Object.assign(experimentOptions.metrics,styleLabUsage(data));if(trace)trace.response=data;log.input=data.usage?.prompt_tokens??null;log.output=data.usage?.completion_tokens??null;log.finishReason=data.choices?.[0]?.finish_reason??null;if(kind==='persona'&&log.finishReason==='length'){lastPersonaRaw=typeof reply==='string'?reply:null;throw Error('模型达到输出长度限制，原始输出可导出')}if(typeof reply!=='string')throw Error('API 未返回文本');log.status='ok';finishGeneration('received');return reply}catch(e){log.status='failed';finishGeneration('failed',e.name==='AbortError'?'请求超时':e.message);throw e}finally{clearTimeout(timer);if(trace){trace.status=log.status;trace.usage={input:log.input,output:log.output,finishReason:log.finishReason};try{await diaTracePut(trace)}catch(e){log.traceError=e.message||String(e)}}await save()}}

<script>
(async function bootBe(){
 const main=document.querySelector('main'),shell=document.getElementById('shell');main.style.pointerEvents='none';shell.style.display='block';shell.textContent='正在读取本地数据库…';
 let conn,revision=0,stored='',pending=0,tail=Promise.resolve(),conflict=false,lastError='';

 function write(raw,expected){return new Promise((resolve,reject)=>{let err;const tx=conn.transaction('state','readwrite'),store=tx.objectStore('state'),q=store.get('main');q.onsuccess=()=>{const actual=q.result?.revision||0;if(actual!==expected){conflict=true;err=Error('另一个窗口已修改数据库，请刷新后重试');tx.abort();return}store.put({id:'main',raw,revision:expected+1})};tx.oncomplete=()=>resolve(expected+1);tx.onabort=()=>reject(err||tx.error||Error('本地数据库写入中止'));tx.onerror=()=>reject(err||tx.error||Error('本地数据库写入失败'))})}
 function report(e){const msg=e.message||String(e);if(msg!==lastError){lastError=msg;alert('本地保存失败：'+msg+'。此前已确认保存的数据仍保留；请不要清除缓存。')}}

 conn=await new Promise((resolve,reject)=>{const q=indexedDB.open('be-main-state',1);q.onupgradeneeded=()=>q.result.createObjectStore('state',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error);q.onblocked=()=>reject(Error('数据库被其他窗口占用，请关闭其他 be 窗口后刷新'))});

 }catch(e){shell.textContent='本地数据库启动失败：'+(e.message||e)+'。旧数据未删除，请勿清除缓存。刷新后可重试。';main.style.pointerEvents='none'}
})();
